<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F3EE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Carnet">
<meta name="mobile-web-app-capable" content="yes">
<title>Carnet // Entraînement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{
  --bg:#F5F3EE;
  --surface:#FFFFFF;
  --surface-2:#EDEAE2;
  --border:#D8D3C6;
  --text:#1B1B18;
  --text-dim:#5B5A54;
  --ink:#14140F;
  --lime:#8CA300;
  --lime-ink:#FFFFFF;
  --aviron:#0E6E82;
  --velo:#A8600A;
  --course:#B23A2E;
  --muscu:#5B4A9E;
  --radius:12px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',system-ui,sans-serif;
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
h1,h2,h3,.display{font-family:'Space Grotesk',system-ui,sans-serif;color:var(--ink);}
.mono{font-family:'JetBrains Mono',monospace;}
a{color:var(--aviron);font-weight:600;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}

/* ---- layout ---- */
#app{max-width:960px;margin:0 auto;padding:0 16px calc(110px + env(safe-area-inset-bottom));}
header.top{
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(20px + env(safe-area-inset-top)) 0 14px;position:sticky;top:0;background:var(--bg);z-index:20;
  border-bottom:2px solid var(--ink);
}
.logo{font-size:22px;font-weight:700;letter-spacing:-0.01em;color:var(--ink);}
.logo span{color:var(--lime);}
nav.tabs{display:flex;gap:8px;overflow-x:auto;padding:14px 0;margin-bottom:6px;-webkit-overflow-scrolling:touch;}
nav.tabs button{
  background:var(--surface);border:2px solid var(--border);color:var(--text);
  padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;white-space:nowrap;
  transition:all .15s;
}
nav.tabs button.active{background:var(--ink);color:#FFFFFF;border-color:var(--ink);}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px;box-shadow:0 1px 2px rgba(0,0,0,.04);}
.card h3{margin:0 0 14px;font-size:15px;color:var(--text);text-transform:uppercase;letter-spacing:.04em;font-weight:700;}
.row{display:flex;gap:10px;flex-wrap:wrap;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
@media (max-width:600px){.grid3{grid-template-columns:1fr;}}

/* ---- signature element: weekly strip (lundi -> dimanche) ---- */
.week-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:4px;}
.week-cell{
  border-radius:10px;background:var(--surface-2);border:2px solid var(--border);
  padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:108px;
  cursor:pointer;
}
.week-cell.today{border-color:var(--ink);}
.week-cell .wc-day{font-size:11px;font-weight:700;color:var(--text-dim);text-transform:uppercase;}
.week-cell .wc-num{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;color:var(--ink);margin-top:-4px;}
.week-cell .wc-chips{display:flex;flex-direction:column;gap:3px;width:100%;flex:1;justify-content:center;}
.week-chip{
  border-radius:5px;color:#fff;font-size:10.5px;font-weight:700;text-align:center;
  padding:3px 2px;line-height:1.2;font-family:'JetBrains Mono',monospace;
}
.week-chip.planned{background:transparent;border:1.5px dashed currentColor;color:var(--text-dim);font-weight:600;}
.week-cell .wc-total{font-size:10px;color:var(--text-dim);font-weight:700;}

.badge{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:999px;font-size:13px;font-weight:700;color:#fff;}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
.b-aviron{background:var(--aviron);}
.b-velo{background:var(--velo);}
.b-course{background:var(--course);}
.b-muscu{background:var(--muscu);}

.stat{display:flex;flex-direction:column;gap:4px;}
.stat .num{font-family:'JetBrains Mono',monospace;font-size:30px;font-weight:700;color:var(--ink);}
.stat .lbl{font-size:12px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.04em;font-weight:600;}

table{width:100%;border-collapse:collapse;font-size:14px;}
th{text-align:left;color:var(--text-dim);font-size:12px;text-transform:uppercase;letter-spacing:.03em;padding:8px 8px;border-bottom:2px solid var(--ink);font-weight:700;}
td{padding:11px 8px;border-bottom:1px solid var(--border);vertical-align:middle;color:var(--text);}
tr:last-child td{border-bottom:none;}
.icon-btn{background:none;border:none;color:var(--text-dim);font-size:16px;padding:10px 10px;border-radius:6px;min-width:40px;min-height:40px;}
.icon-btn:hover{background:var(--surface-2);color:var(--text);}

input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;background:var(--surface);border:2px solid var(--border);color:var(--text);
  padding:11px 12px;border-radius:8px;font-size:15px;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink);}
label{font-size:12px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.03em;display:block;margin-bottom:6px;font-weight:700;}
.field{margin-bottom:14px;}
.btn{
  display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:#fff;border:none;
  padding:13px 18px;border-radius:8px;font-weight:700;font-size:14px;
}
.btn.secondary{background:var(--surface);color:var(--text);border:2px solid var(--border);}
.btn.danger{background:#FBEAE8;color:var(--course);border:2px solid var(--course);}
.btn:disabled{opacity:.5;cursor:not-allowed;}

.fab{
  position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));right:24px;width:60px;height:60px;border-radius:50%;
  background:var(--ink);color:#fff;border:none;font-size:28px;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:30;
}
.modal-backdrop{position:fixed;inset:0;background:rgba(20,20,15,.55);display:none;align-items:flex-end;justify-content:center;z-index:40;}
.modal-backdrop.open{display:flex;}
@media (min-width:640px){.modal-backdrop{align-items:center;}}
.modal{
  background:var(--surface);border:1px solid var(--border);border-radius:16px 16px 0 0;
  padding:22px 22px calc(22px + env(safe-area-inset-bottom));width:100%;max-width:520px;max-height:88vh;overflow-y:auto;
}
@media (min-width:640px){.modal{border-radius:16px;}}
.modal h2{margin:0 0 16px;font-size:20px;}
.sportpicker{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.sportpicker button{
  flex:1;min-width:80px;padding:13px 8px;border-radius:10px;border:2px solid var(--border);
  background:var(--surface);color:var(--text);font-size:13px;font-weight:700;
}
.sportpicker button.sel{border-color:var(--ink);color:#fff;background:var(--ink);}
.progress-ring{width:34px;height:34px;flex:none;}
.hint{font-size:13.5px;color:var(--text-dim);line-height:1.6;margin-top:8px;}
.empty{color:var(--text-dim);font-size:14px;padding:24px 0;text-align:center;}
.tag-sport{font-size:12px;font-weight:700;}
select[multiple]{height:auto;}
.close-x{position:absolute;top:16px;right:16px;background:var(--surface-2);border:none;color:var(--text);font-size:18px;width:40px;height:40px;border-radius:50%;line-height:1;}
.modal-wrap{position:relative;}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);}
.toggle-row:last-child{border-bottom:none;}

/* ---- calendrier mensuel ---- */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.cal-nav .cal-title{font-family:'Space Grotesk',system-ui,sans-serif;font-size:18px;font-weight:700;text-transform:capitalize;}
.cal-nav button{background:var(--surface-2);border:2px solid var(--border);color:var(--text);width:36px;height:36px;border-radius:8px;font-size:16px;font-weight:700;}
.cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px;}
.cal-weekdays div{text-align:center;font-size:11px;font-weight:700;color:var(--text-dim);text-transform:uppercase;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.cal-cell{
  border-radius:8px;border:2px solid var(--border);background:var(--surface);
  padding:5px 3px;display:flex;flex-direction:column;gap:3px;position:relative;
  min-height:74px;cursor:pointer;
}
.cal-cell.out{opacity:.35;}
.cal-cell.today{border-color:var(--ink);}
.cal-cell.selected{background:var(--ink);}
.cal-cell.selected .cal-daynum{color:#fff;}
.cal-daynum{font-size:13px;font-weight:700;font-family:'JetBrains Mono',monospace;}
.cal-dots{display:flex;gap:3px;flex-wrap:wrap;}
.cal-dot{width:9px;height:9px;border-radius:50%;flex:none;}
.cal-dot.planned{background:transparent;border:2px solid currentColor;}
.cal-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;font-size:12px;color:var(--text-dim);}
.cal-legend span{display:inline-flex;align-items:center;gap:6px;}
.cal-legend .sw{width:10px;height:10px;border-radius:50%;display:inline-block;}
.cal-daylist{margin-top:16px;}
.cal-daylist-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
.cal-daylist-item:last-child{border-bottom:none;}

/* ---- calendrier : chips détaillées dans les cellules ---- */
.cal-chip{font-size:9.5px;font-weight:700;border-radius:4px;padding:1px 4px;color:#fff;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cal-chip.planned{background:transparent;border:1px dashed currentColor;color:var(--text-dim);}
.cal-chiplist{display:flex;flex-direction:column;gap:2px;width:100%;}
.cal-more{font-size:9px;color:var(--text-dim);font-weight:700;}
.mark-done-btn{background:var(--surface-2);border:2px solid var(--ink);color:var(--ink);font-size:11.5px;font-weight:700;padding:6px 10px;border-radius:7px;white-space:nowrap;min-height:36px;}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;}
.table-scroll td, .table-scroll th{padding-left:6px;padding-right:6px;}
.table-scroll.wide table{min-width:560px;}

/* ---- écran de verrouillage ---- */
.lock-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.lock-card{max-width:380px;width:100%;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px 24px;box-shadow:0 4px 16px rgba(0,0,0,.06);}
.lock-card h2{margin:0 0 4px;font-size:20px;}
.lock-card .lock-sub{color:var(--text-dim);font-size:13.5px;margin-bottom:18px;}
.lock-error{color:var(--course);font-size:13px;font-weight:600;margin-top:8px;min-height:16px;}

/* ---- paramètres : sous-onglets ---- */
.subtabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
.subtabs button{background:var(--surface-2);border:2px solid var(--border);color:var(--text);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:700;}
.subtabs button.active{background:var(--ink);color:#fff;border-color:var(--ink);}

/* ---- objectifs ---- */
.goal-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);}
.goal-row:last-child{border-bottom:none;}
.goal-label{width:92px;flex:none;}
.goal-bar-wrap{flex:1;height:10px;background:var(--surface-2);border-radius:999px;overflow:hidden;}
.goal-bar-fill{height:100%;border-radius:999px;transition:width .3s;}
.goal-num{width:64px;flex:none;text-align:right;font-size:12px;color:var(--text-dim);font-weight:700;}
</style>
</head>
<body>
<div id="lockScreen"></div>
<div id="app" style="display:none;">
  <header class="top">
    <div class="logo">Carnet<span>//</span>Entraînement</div>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <div id="view"></div>
</div>

<button class="fab" id="fabAdd" title="Ajouter une séance" style="display:none;">+</button>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal modal-wrap" id="modalContent"></div>
</div>

<script>
/* ============ STORAGE HELPERS (localStorage — déploiement autonome) ============ */
const STORAGE_PREFIX = 'carnet-entrainement:';
async function loadKey(key, fallback){
  try{
    const raw = localStorage.getItem(STORAGE_PREFIX+key);
    return raw!=null ? JSON.parse(raw) : fallback;
  }catch(e){ console.error('storage read error', key, e); return fallback; }
}
async function saveKey(key, value){
  try{ localStorage.setItem(STORAGE_PREFIX+key, JSON.stringify(value)); }
  catch(e){ console.error('storage write error', key, e); }
}

/* ============ SAUVEGARDE / RESTAURATION (export-import JSON) ============ */
function exportBackup(){
  const backup = {
    app:'carnet-entrainement', version:1, exportedAt:new Date().toISOString(),
    sessions:SESSIONS, plan:PLAN,
    settings:{ goals:SETTINGS.goals||{}, notifications:SETTINGS.notifications||{} },
  };
  const blob = new Blob([JSON.stringify(backup,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `carnet-entrainement-sauvegarde-${todayISO()}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function importBackup(file, statusEl){
  try{
    const text = await file.text();
    const data = JSON.parse(text);
    if(!Array.isArray(data.sessions) || !Array.isArray(data.plan)){
      statusEl.textContent = 'Fichier invalide : ce n\'est pas une sauvegarde reconnue.';
      return;
    }
    const merge = confirm(`Importer ${data.sessions.length} séance(s) et ${data.plan.length} entrée(s) de planning ?\nOK = fusionner avec les données existantes. Annuler = remplacer entièrement.`);
    if(merge){
      const existingIds = new Set(SESSIONS.map(s=>s.id));
      data.sessions.forEach(s=>{ if(!existingIds.has(s.id)) SESSIONS.push(s); });
      const existingPlanIds = new Set(PLAN.map(p=>p.id));
      data.plan.forEach(p=>{ if(!existingPlanIds.has(p.id)) PLAN.push(p); });
    } else {
      SESSIONS = data.sessions;
      PLAN = data.plan;
    }
    if(data.settings){
      SETTINGS.goals = data.settings.goals||SETTINGS.goals;
      SETTINGS.notifications = data.settings.notifications||SETTINGS.notifications;
    }
    await saveSessions(); await savePlan(); await saveSettings();
    statusEl.textContent = 'Sauvegarde importée avec succès.';
    if(currentTab) renderView();
  }catch(e){
    statusEl.textContent = 'Erreur de lecture du fichier : ' + e.message;
  }
}

let SESSIONS = [];   // séances réalisées
let PLAN = [];        // séances planifiées
let SETTINGS = {};    // réglages (tokens etc.)

const SPORTS = {
  aviron:   { label:'Aviron',        color:'var(--aviron)', class:'b-aviron', metric:'distance' },
  velo:     { label:'Vélo',          color:'var(--velo)',   class:'b-velo',   metric:'distance' },
  course:   { label:'Course à pied', color:'var(--course)', class:'b-course', metric:'distance' },
  muscu:    { label:'Musculation',   color:'var(--muscu)',  class:'b-muscu',  metric:'duration' },
};

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
/* Formatage de date en LOCAL (jamais toISOString(), qui convertit en UTC et peut décaler d'un jour) */
function toLocalISO(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function todayISO(){ return toLocalISO(new Date()); }
function fmtDate(d){ const dt=new Date(d+'T00:00:00'); return dt.toLocaleDateString('fr-FR',{day:'2-digit',month:'short'}); }
function isoWeekKey(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const dt = new Date(d.getTime());
  dt.setHours(0,0,0,0);
  dt.setDate(dt.getDate() + 3 - ((dt.getDay()+6)%7));
  const week1 = new Date(dt.getFullYear(),0,4);
  const wk = 1 + Math.round(((dt-week1)/86400000 - 3 + ((week1.getDay()+6)%7))/7);
  return dt.getFullYear()+'-W'+String(wk).padStart(2,'0');
}
function monthKey(dateStr){ return dateStr.slice(0,7); }
function yearKey(dateStr){ return dateStr.slice(0,4); }
function startOfWeek(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const day = (d.getDay()+6)%7;
  d.setDate(d.getDate()-day);
  return d;
}

/* ============ TABS ============ */
const TABS = [
  {id:'dashboard', label:'Accueil'},
  {id:'calendar', label:'Calendrier'},
  {id:'planning', label:'Planning'},
  {id:'seances', label:'Séances'},
  {id:'parametres', label:'Paramètres'},
];
let currentTab = 'dashboard';

function renderTabs(){
  const nav = document.getElementById('tabs');
  nav.innerHTML = TABS.map(t=>`<button data-tab="${t.id}" class="${t.id===currentTab?'active':''}">${t.label}</button>`).join('');
  nav.querySelectorAll('button').forEach(b=>{
    b.onclick = ()=>{ currentTab = b.dataset.tab; renderTabs(); renderView(); };
  });
}

function renderView(){
  const v = document.getElementById('view');
  if(currentTab==='dashboard') v.innerHTML = viewDashboard();
  if(currentTab==='calendar') v.innerHTML = viewCalendar();
  if(currentTab==='planning') v.innerHTML = viewPlanning();
  if(currentTab==='seances') v.innerHTML = viewSeances();
  if(currentTab==='parametres') v.innerHTML = viewParametres();
  attachHandlers();
}

/* ============ DASHBOARD ============ */
let dashPeriod = 'semaine';

function filterByPeriod(list, period){
  const now = new Date();
  return list.filter(s=>{
    if(period==='semaine') return isoWeekKey(s.date)===isoWeekKey(todayISO());
    if(period==='mois') return monthKey(s.date)===monthKey(todayISO());
    if(period==='annee') return yearKey(s.date)===yearKey(todayISO());
    return true;
  });
}

function viewDashboard(){
  const inPeriod = filterByPeriod(SESSIONS, dashPeriod);

  const totalDuration = inPeriod.reduce((a,s)=>a+(Number(s.duration)||0),0);
  const linked = inPeriod.filter(s=>s.completion!=null);
  const avgCompletion = linked.length ? Math.round(linked.reduce((a,s)=>a+s.completion,0)/linked.length) : null;

  // totaux par catégorie — calculés sur la période sélectionnée, indépendamment de tout filtre
  const bySport = {};
  Object.keys(SPORTS).forEach(k=>bySport[k]={count:0, duration:0, distance:0, completions:[]});
  inPeriod.forEach(s=>{
    const b = bySport[s.sport];
    if(!b) return;
    b.count++;
    b.duration += Number(s.duration)||0;
    b.distance += Number(s.distance)||0;
    if(s.completion!=null) b.completions.push(s.completion);
  });

  // bandeau hebdo : lundi -> dimanche de la semaine en cours
  const monday = startOfWeek(todayISO());
  const weekDayLabels = ['LUN','MAR','MER','JEU','VEN','SAM','DIM'];
  const days = [];
  for(let i=0;i<7;i++){
    const d = new Date(monday); d.setDate(monday.getDate()+i);
    const iso = toLocalISO(d);
    const dayS = SESSIONS.filter(s=>s.date===iso);
    const dayP = PLAN.filter(p=>p.date===iso && !p.linkedSessionId);
    const dur = dayS.reduce((a,s)=>a+(Number(s.duration)||0),0);
    days.push({iso, dayLabel:weekDayLabels[i], num:d.getDate(), dur, sessions:dayS, plans:dayP});
  }

  const upcoming = PLAN.filter(p=>!p.linkedSessionId && p.date>=todayISO()).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5);

  return `
  <div class="card">
    <h3>Bilan de la semaine</h3>
    <div class="week-strip">
      ${days.map(d=>{
        const chips = d.sessions.map(s=>`<div class="week-chip" style="background:${getComputedColor(s.sport)}" title="${SPORTS[s.sport].label}">${s.duration?s.duration+"'":SPORTS[s.sport].label.slice(0,3)}</div>`).join('');
        const plannedChips = d.plans.map(p=>`<div class="week-chip planned" style="color:${getComputedColor(p.sport)}" title="${SPORTS[p.sport].label} prévue">${SPORTS[p.sport].label.slice(0,3)}</div>`).join('');
        return `<div class="week-cell ${d.iso===todayISO()?'today':''}" data-cal-day="${d.iso}">
          <div class="wc-day">${d.dayLabel}</div>
          <div class="wc-num">${d.num}</div>
          <div class="wc-chips">${chips}${plannedChips}${(!chips && !plannedChips)?'<div class="hint" style="margin:0;text-align:center;">—</div>':''}</div>
          <div class="wc-total">${d.dur?d.dur+' min':''}</div>
        </div>`;
      }).join('')}
    </div>
  </div>

  ${(()=>{

function initProgressChart(){
  const canvas = document.getElementById('chartProgress');
  if(!canvas || typeof Chart==='undefined') return;
  const monday = startOfWeek(todayISO());
  const weeks = [];
  for(let i=7;i>=0;i--){
    const wkStart = new Date(monday); wkStart.setDate(monday.getDate()-7*i);
    const wkEnd = new Date(wkStart); wkEnd.setDate(wkStart.getDate()+6);
    const startIso = toLocalISO(wkStart), endIso = toLocalISO(wkEnd);
    const total = SESSIONS.filter(s=>s.date>=startIso && s.date<=endIso).reduce((a,s)=>a+(Number(s.duration)||0),0);
    weeks.push({label: wkStart.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'}), total: Math.round(total/60*10)/10});
  }

  window._progressChart = new Chart(canvas, {

/* ============ CALENDRIER MENSUEL ============ */
let calDate = new Date();       // mois affiché
let calSelected = null;         // date ISO sélectionnée

function viewCalendar(){
  const year = calDate.getFullYear();
  const month = calDate.getMonth();
  const firstOfMonth = new Date(year, month, 1);
  const startOffset = (firstOfMonth.getDay()+6)%7; // lundi=0
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const gridStart = new Date(year, month, 1-startOffset);

  const cells = [];
  for(let i=0;i<42;i++){
    const d = new Date(gridStart); d.setDate(gridStart.getDate()+i);
    cells.push(d);
  }

  const monthLabel = firstOfMonth.toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
  const todayIso = todayISO();

  const cellsHTML = cells.map(d=>{
    const iso = toLocalISO(d);
    const inMonth = d.getMonth()===month;
    const daySessions = SESSIONS.filter(s=>s.date===iso);
    const dayPlansUnlinked = PLAN.filter(p=>p.date===iso && !p.linkedSessionId);
    const items = [
      ...daySessions.map(s=>({sport:s.sport, label:s.duration?s.duration+"'":SPORTS[s.sport].label.slice(0,3), done:true})),
      ...dayPlansUnlinked.map(p=>({sport:p.sport, label:SPORTS[p.sport].label.slice(0,3), done:false})),
    ];
    const shown = items.slice(0,2);
    const extra = items.length - shown.length;
    const chipsHTML = shown.map(it=>{
      const color = getComputedColor(it.sport);
      return it.done
        ? `<div class="cal-chip" style="background:${color}">${it.label}</div>`
        : `<div class="cal-chip planned" style="color:${color}">${it.label}</div>`;
    }).join('') + (extra>0?`<div class="cal-more">+${extra}</div>`:'');
    return `<div class="cal-cell ${inMonth?'':'out'} ${iso===todayIso?'today':''} ${iso===calSelected?'selected':''}" data-cal-day="${iso}">
      <div class="cal-daynum">${d.getDate()}</div>
      <div class="cal-chiplist">${chipsHTML}</div>
    </div>`;
  }).join('');

  const selDate = calSelected || todayIso;
  const selSessions = SESSIONS.filter(s=>s.date===selDate);
  const selPlans = PLAN.filter(p=>p.date===selDate);

  return `
  <div class="card">
    <div class="cal-nav">
      <button data-cal-nav="-1">‹</button>
      <div class="cal-title">${monthLabel}</div>
      <button data-cal-nav="1">›</button>
    </div>
    <div class="cal-weekdays"><div>L</div><div>M</div><div>M</div><div>J</div><div>V</div><div>S</div><div>D</div></div>
    <div class="cal-grid">${cellsHTML}</div>
    <div class="cal-legend">
      ${Object.entries(SPORTS).map(([k,v])=>`<span><span class="sw" style="background:${v.color}"></span>${v.label}</span>`).join('')}
    </div>
    <div class="cal-legend" style="margin-top:6px;">
      <span><span class="cal-chip" style="background:var(--text-dim);padding:2px 6px;">45'</span>réalisée (durée)</span>
      <span><span class="cal-chip planned" style="color:var(--text-dim);padding:2px 6px;">Rép&nbsp;</span>prévue, pas encore faite</span>
    </div>

    <div class="cal-daylist">
      <h3 style="margin-bottom:8px;">${fmtDate(selDate)}</h3>
      ${(selSessions.length===0 && selPlans.length===0) ? `<div class="empty">Rien ce jour-là.</div>` : ''}
      ${selPlans.map(p=>`<div class="cal-daylist-item">
        <span class="badge ${SPORTS[p.sport].class}">${SPORTS[p.sport].label}</span>
        <div style="flex:1;">
          <div>${p.title||'Séance planifiée'}</div>
          <div class="hint" style="margin:0;">${p.targetDuration?p.targetDuration+' min':''}${p.targetDistance?' · '+p.targetDistance+' km':''} — ${p.linkedSessionId?'réalisée':'à faire'}</div>
        </div>
        ${!p.linkedSessionId?`<button class="mark-done-btn" data-mark-done="${p.id}">Marquer réalisée</button>`:''}
      </div>`).join('')}
      ${selSessions.map(s=>`<div class="cal-daylist-item">
        <span class="badge ${SPORTS[s.sport].class}">${SPORTS[s.sport].label}</span>
        <div style="flex:1;">
          <div>${s.notes||'Séance réalisée'}</div>
          <div class="hint" style="margin:0;">${s.duration?s.duration+' min':''}${s.distance?' · '+s.distance+' km':''}${s.completion!=null?' · '+s.completion+'% du planning':''}</div>
        </div>
      </div>`).join('')}
      <button class="btn secondary" id="btnCalAdd" style="margin-top:12px;width:100%;">+ Ajouter une séance ce jour</button>
    </div>
  </div>`;
}

async function handleExcelFile(file){
  const status = document.getElementById('excelStatus');
  status.textContent = 'Lecture du fichier…';
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, {type:'array'});
  const sheet = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
  if(!rows.length){ status.textContent = 'Fichier vide ou illisible.'; return; }
  let added = 0;
  rows.forEach(r=>{
    const keys = Object.keys(r).reduce((acc,k)=>{acc[k.toLowerCase().trim()]=r[k];return acc;},{});
    const rawDate = keys['date'];
    const dateISO = parseFrenchDate(rawDate);
    if(!dateISO) return;
    const sportRaw = (keys['sport']||'').toString().toLowerCase();
    const sport = matchSport(sportRaw);
    if(!sport) return;
    PLAN.push({
      id: uid(),
      date: dateISO,
      sport,
      title: keys['titre']||keys['description']||'',
      targetDuration: Number(keys['durée']||keys['duree']||0)||null,
      targetDistance: Number(keys['distance']||0)||null,
      source:'excel',
      linkedSessionId:null,
    });
    added++;
  });
  await savePlan();
  status.textContent = `${added} séance(s) importée(s) et ajoutée(s) au planning.`;
  if(currentTab==='planning') renderView();
}

function parseFrenchDate(v){
  if(!v) return null;
  if(v instanceof Date) return toLocalISO(v);
  const s = v.toString().trim();
  let m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
  if(m){ let [_,d,mo,y]=m; if(y.length===2) y='20'+y; return `${y}-${mo.padStart(2,'0')}-${d.padStart(2,'0')}`; }
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m){ let [_,y,mo,d]=m; return `${y}-${mo.padStart(2,'0')}-${d.padStart(2,'0')}`; }
  const dt = new Date(s);
  if(!isNaN(dt)) return toLocalISO(dt);
  return null;
}
function matchSport(raw){
  raw = raw.toLowerCase();
  if(raw.includes('aviron')||raw.includes('rame')||raw.includes('ergo')) return 'aviron';
  if(raw.includes('vélo')||raw.includes('velo')||raw.includes('bike')||raw.includes('cycl')) return 'velo';
  if(raw.includes('course')||raw.includes('run')||raw.includes('cap')) return 'course';
  if(raw.includes('muscu')||raw.includes('force')||raw.includes('renfo')) return 'muscu';
  return null;

async function handlePdfFile(file){
  const area = document.getElementById('pdfArea');
  area.innerHTML = '<div class="hint">Extraction du texte…</div>';
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data:buf}).promise;
  let fullText = '';
  for(let i=1;i<=pdf.numPages;i++){
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    fullText += content.items.map(it=>it.str).join(' ') + '\n';
  }
  // heuristique: découpe en lignes, cherche motifs date
  const lines = fullText.split(/\n|(?=\d{1,2}\/\d{1,2})/).map(l=>l.trim()).filter(Boolean);
  area.innerHTML = `
    <p class="hint">Texte extrait — corrige si besoin puis valide ligne par ligne. Format suggéré par ligne : <span class="mono">jj/mm/aaaa | sport | titre | durée(min) | distance(km)</span></p>
    <textarea id="pdfTextArea" rows="10" style="font-family:'JetBrains Mono',monospace;font-size:12px;">${lines.slice(0,60).join('\n')}</textarea>
    <div class="row" style="margin-top:10px;">
      <button class="btn" id="btnImportPdfLines">Analyser et importer</button>
    </div>
    <div id="pdfImportStatus" class="hint"></div>
  `;
  document.getElementById('btnImportPdfLines').onclick = ()=>importPdfLines();
}

async function importPdfLines(){
  const ta = document.getElementById('pdfTextArea');
  const status = document.getElementById('pdfImportStatus');
  const lines = ta.value.split('\n').map(l=>l.trim()).filter(Boolean);
  let added = 0;
  lines.forEach(line=>{
    const parts = line.split('|').map(p=>p.trim());
    let dateISO=null, sport=null, title='', duration=null, distance=null;
    if(parts.length>=2){
      dateISO = parseFrenchDate(parts[0]);
      sport = matchSport(parts[1]||'');
      title = parts[2]||'';
      duration = Number(parts[3])||null;
      distance = Number(parts[4])||null;
    } else {
      const dm = line.match(/(\d{1,2}\/\d{1,2}\/\d{2,4}|\d{1,2}\/\d{1,2})/);
      dateISO = dm ? parseFrenchDate(dm[1].split('/').length===2? dm[1]+'/'+new Date().getFullYear() : dm[1]) : null;
      sport = matchSport(line);
      title = line;
    }
    if(dateISO && sport){
      PLAN.push({id:uid(), date:dateISO, sport, title, targetDuration:duration, targetDistance:distance, source:'pdf', linkedSessionId:null});
      added++;
    }
  });
  await savePlan();
  status.textContent = `${added} ligne(s) importée(s) sur ${lines.length}. Vérifie le résultat dans l'onglet Planning.`;
}

async function stravaConnect(){
  const workerUrl = document.getElementById('stravaWorkerUrl').value.trim().replace(/\/$/,'');
  const clientId = document.getElementById('stravaClientId').value.trim();
  const status = document.getElementById('stravaStatus');
  if(!clientId){ status.textContent = 'Renseigne au moins le Client ID (créé sur strava.com/settings/api).'; return; }
  SETTINGS.strava = {...(SETTINGS.strava||{}), clientId, workerUrl};
  await saveSettings();
  const redirectUri = window.location.origin + window.location.pathname;
  const url = `https://www.strava.com/oauth/authorize?client_id=${encodeURIComponent(clientId)}&redirect_uri=${encodeURIComponent(redirectUri)}&response_type=code&scope=activity:read_all&approval_prompt=auto`;
  window.location.href = url;
}

async function handleStravaCallback(){
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  if(!code) return;
  window.history.replaceState({}, '', window.location.pathname);
  const strava = SETTINGS.strava || {};
  if(!strava.clientId) return;
  try{
    let resp;
    if(strava.workerUrl){
      resp = await fetch(strava.workerUrl+'/token', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({client_id:strava.clientId, code})
      });
    } else if(strava.clientSecret){
      resp = await fetch('https://www.strava.com/oauth/token', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({client_id:strava.clientId, client_secret:strava.clientSecret, code, grant_type:'authorization_code'})
      });
    } else {
      alert("Aucun relais configuré : l'échange de jeton va probablement échouer. Configure l'URL du relais dans Connexions, ou utilise le jeton manuel.");
      return;
    }
    const data = await resp.json();
    if(data.access_token){
      SETTINGS.strava.accessToken = data.access_token;
      SETTINGS.strava.refreshToken = data.refresh_token;
      SETTINGS.strava.expiresAt = data.expires_at;
      await saveSettings();
      await stravaFetchActivities(data.access_token, null, strava.workerUrl);
    } else {
      alert('Strava a répondu sans jeton — voir le champ jeton manuel comme solution de repli.');
    }
  }catch(e){
    alert("L'échange de jeton a échoué depuis le navigateur (limite CORS connue côté Strava, sans relais configuré). Configure l'URL du relais Cloudflare Worker (voir README), ou utilise la solution de repli avec le jeton manuel ci-dessous.");
  }
}

async function stravaManualFetch(){
  const token = document.getElementById('stravaManualToken').value.trim();
  const status = document.getElementById('stravaManualStatus');
  if(!token){ status.textContent='Colle un token.'; return; }

async function stravaFetchActivities(token, status, workerUrl){
  status = status || document.getElementById('stravaStatus');
  const base = workerUrl ? workerUrl+'/activities' : 'https://www.strava.com/api/v3/athlete/activities';
  try{
    const resp = await fetch(base+'?per_page=30', {
      headers:{ 'Authorization': 'Bearer '+token }
    });
    if(!resp.ok) throw new Error('HTTP '+resp.status);
    const acts = await resp.json();
    let added = 0;
    acts.forEach(a=>{
      if(SESSIONS.find(s=>s.stravaId===a.id)) return;
      const sport = mapStravaType(a.type||a.sport_type);
      if(!sport) return;
      const session = {
        id: uid(), stravaId:a.id, date: a.start_date_local.slice(0,10), sport,
        duration: Math.round((a.moving_time||0)/60), distance: a.distance? Math.round(a.distance/100)/10 : null,
        source:'strava', completion:null, notes:a.name||'',
      };
      autoLinkSession(session);
      SESSIONS.push(session);
      added++;
    });
    await saveSessions();
    await savePlan();
    status.textContent = `${added} activité(s) récupérée(s) depuis Strava.`;
    if(currentTab==='seances'||currentTab==='planning'||currentTab==='calendar') renderView();
  }catch(e){
    status.textContent = workerUrl
      ? "Le relais n'a pas répondu correctement — vérifie l'URL et que le Worker est bien déployé (voir README)."
      : "Connexion directe bloquée par Strava (CORS) depuis ce navigateur, sans relais configuré. Configure l'URL du relais Cloudflare Worker ci-dessus (voir README), ou utilise l'export de données Strava.";
  }
}
function mapStravaType(t){
  if(!t) return null;
  t = t.toLowerCase();
  if(t.includes('row')) return 'aviron';
  if(t.includes('ride')||t.includes('bike')||t.includes('cycl')) return 'velo';
  if(t.includes('run')) return 'course';
  if(t.includes('weight')||t.includes('workout')||t.includes('strength')) return 'muscu';
  return null;
}

/* Auto-association : cherche une séance planifiée non liée, même sport, date à ±1 jour, et calcule le % de réalisation. */
function autoLinkSession(session){
  const candidates = PLAN.filter(p=>!p.linkedSessionId && p.sport===session.sport);
  if(!candidates.length) return session;
  const sessionDate = new Date(session.date+'T00:00:00');
  let best=null, bestDiff=Infinity;
  candidates.forEach(p=>{
    const diff = Math.abs(new Date(p.date+'T00:00:00') - sessionDate);
    if(diff <= 86400000 && diff<bestDiff){ best=p; bestDiff=diff; }
  });
  if(best){
    const metric = SPORTS[session.sport].metric;
    let pct=null;
    if(metric==='distance' && best.targetDistance && session.distance) pct = Math.round((session.distance/best.targetDistance)*100);
    else if(best.targetDuration && session.duration) pct = Math.round((session.duration/best.targetDuration)*100);
    session.completion = pct;
    session.linkedPlanId = best.id;
    best.linkedSessionId = session.id;
  }
  return session;
}

async function handleGarminFile(file){
  const status = document.getElementById('garminStatus');
  status.textContent = 'Lecture du fichier…';
  const name = file.name.toLowerCase();
  if(name.endsWith('.csv')){
    const text = await file.text();
    const rows = text.split('\n').map(r=>r.split(','));
    const header = rows[0].map(h=>h.toLowerCase().trim());
    const idxDate = header.findIndex(h=>h.includes('date'));
    const idxType = header.findIndex(h=>h.includes('activity type')||h.includes('type'));
    const idxDur = header.findIndex(h=>h.includes('time')||h.includes('durée')||h.includes('duree'));
    const idxDist = header.findIndex(h=>h.includes('distance'));
    let added=0;
    rows.slice(1).forEach(r=>{
      if(r.length<2) return;
      const dateISO = parseFrenchDate(r[idxDate]);
      const sport = matchSport((r[idxType]||'').toString());
      if(!dateISO || !sport) return;
      const session = {
        id:uid(), date:dateISO, sport,
        duration: idxDur>-1 ? parseDurationToMin(r[idxDur]) : null,
        distance: idxDist>-1 ? Number(r[idxDist])||null : null,
        source:'garmin_csv', completion:null, notes:''
      };
      autoLinkSession(session);
      SESSIONS.push(session);
      added++;
    });
    await saveSessions();
    await savePlan();
    status.textContent = `${added} activité(s) importée(s) depuis le CSV Garmin.`;
    if(currentTab==='seances'||currentTab==='planning'||currentTab==='calendar') renderView();
  } else {
    status.textContent = 'Format TCX/GPX détecté — pour un import fiable, préfère l’export CSV Garmin Connect (Activités > Exporter), ou ajoute la séance manuellement via le bouton +.';
  }
}
function parseDurationToMin(v){
  if(!v) return null;
  v = v.toString().trim();
  if(v.includes(':')){
    const parts = v.split(':').map(Number);
    if(parts.length===3) return Math.round(parts[0]*60+parts[1]+parts[2]/60);
    if(parts.length===2) return Math.round(parts[0]+parts[1]/60);
  }
  return Number(v)||null;
}

      const b1 = document.getElementById('btnStravaConnect'); if(b1) b1.onclick = stravaConnect;
      const b2 = document.getElementById('btnStravaManualFetch'); if(b2) b2.onclick = stravaManualFetch;
      const fg = document.getElementById('fileGarmin'); if(fg) fg.onchange = e=>{ if(e.target.files[0]) handleGarminFile(e.target.files[0]); };
    }
  }
}

async function saveSessions(){ await saveKey('sessions', SESSIONS); }
async function savePlan(){ await saveKey('plan', PLAN); }
async function saveSettings(){ await saveKey('settings', SETTINGS); }

/* ============ ACCÈS PROTÉGÉ (email + mot de passe) ============ */
async function sha256Hex(str){
  const enc = new TextEncoder().encode(str);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function renderLock(){
  const el = document.getElementById('lockScreen');
  const auth = SETTINGS.auth;
  if(!auth){
    el.innerHTML = lockSetupHTML();
    attachLockSetupHandlers();
  } else if(lockMode==='recover'){
    el.innerHTML = lockRecoverHTML();
    attachLockRecoverHandlers();
  } else if(lockMode==='reset'){
    el.innerHTML = lockResetHTML();
    attachLockResetHandlers();
  } else {
    el.innerHTML = lockLoginHTML(auth.email);
    attachLockLoginHandlers();
  }
  el.style.display = 'flex';
  document.getElementById('app').style.display = 'none';
  document.getElementById('fabAdd').style.display = 'none';
}

function lockSetupHTML(){
  return `<div class="lock-wrap"><div class="lock-card">
    <h2>Créer ton accès</h2>
    <div class="lock-sub">Protège ce carnet avec un email et un mot de passe. Ils restent stockés uniquement dans le stockage privé de cette appli (le mot de passe est haché, jamais gardé en clair).</div>
    <div class="field"><label>Email</label><input type="text" id="setupEmail" placeholder="toi@exemple.com"></div>
    <div class="field"><label>Mot de passe</label><input type="password" id="setupPw"></div>
    <div class="field"><label>Confirmer le mot de passe</label><input type="password" id="setupPw2"></div>
    <div class="field"><label>Question secrète (optionnel, pour récupérer l'accès)</label><input type="text" id="setupQuestion" placeholder="ex: Le nom de mon premier club ?"></div>
    <div class="field"><label>Réponse</label><input type="text" id="setupAnswer"></div>
    <button class="btn" id="btnSetupCreate" style="width:100%;">Créer l'accès</button>
    <div class="lock-error" id="setupError"></div>
  </div></div>`;
}
function attachLockSetupHandlers(){
  document.getElementById('btnSetupCreate').onclick = async ()=>{
    const email = document.getElementById('setupEmail').value.trim();
    const pw = document.getElementById('setupPw').value;
    const pw2 = document.getElementById('setupPw2').value;
    const question = document.getElementById('setupQuestion').value.trim();
    const answer = document.getElementById('setupAnswer').value.trim();
    const err = document.getElementById('setupError');
    if(!email || !pw){ err.textContent='Email et mot de passe requis.'; return; }
    if(pw!==pw2){ err.textContent='Les mots de passe ne correspondent pas.'; return; }
    if(pw.length<4){ err.textContent='Mot de passe trop court (4 caractères minimum).'; return; }
    const hash = await sha256Hex(pw);
    SETTINGS.auth = {email, hash};
    if(question && answer){
      SETTINGS.auth.secretQuestion = question;
      SETTINGS.auth.secretAnswerHash = await sha256Hex(answer.toLowerCase());
    }
    await saveSettings();
    unlockApp();
  };
}

function lockLoginHTML(email){
  return `<div class="lock-wrap"><div class="lock-card">
    <h2>Accès protégé</h2>
    <div class="lock-sub">Connecte-toi pour ouvrir ton carnet d'entraînement.</div>
    <div class="field"><label>Email</label><input type="text" id="loginEmail" value="${email||''}"></div>
    <div class="field"><label>Mot de passe</label><input type="password" id="loginPw"></div>
    <button class="btn" id="btnLoginGo" style="width:100%;">Se connecter</button>
    <button class="btn secondary" id="btnForgot" style="width:100%;margin-top:8px;">Mot de passe oublié ?</button>
    <div class="lock-error" id="loginError"></div>
  </div></div>`;
}
function attachLockLoginHandlers(){
  const go = async ()=>{
    const email = document.getElementById('loginEmail').value.trim();
    const pw = document.getElementById('loginPw').value;
    const err = document.getElementById('loginError');
    const auth = SETTINGS.auth;
    const hash = await sha256Hex(pw);
    if(email.toLowerCase()===auth.email.toLowerCase() && hash===auth.hash){
      unlockApp();
    } else {
      err.textContent = 'Email ou mot de passe incorrect.';
    }
  };
  document.getElementById('btnLoginGo').onclick = go;
  document.getElementById('loginPw').addEventListener('keydown', e=>{ if(e.key==='Enter') go(); });
  document.getElementById('btnForgot').onclick = ()=>{ lockMode='recover'; renderLock(); };
}

let lockMode = 'login'; // 'login' | 'recover' | 'reset'

function lockRecoverHTML(){
  const auth = SETTINGS.auth || {};
  if(!auth.secretQuestion){
    return `<div class="lock-wrap"><div class="lock-card">
      <h2>Récupération impossible</h2>
      <div class="lock-sub">Aucune question secrète n'a été configurée pour ce compte. Sans elle, il n'y a pas de moyen de réinitialiser le mot de passe sans effacer les données du site (Réglages du navigateur → Effacer les données de ce site).</div>
      <button class="btn secondary" id="btnBackToLogin" style="width:100%;">Retour</button>
    </div></div>`;
  }
  return `<div class="lock-wrap"><div class="lock-card">
    <h2>Mot de passe oublié</h2>
    <div class="lock-sub">${auth.secretQuestion}</div>
    <div class="field"><label>Réponse</label><input type="text" id="recoverAnswer"></div>
    <button class="btn" id="btnRecoverGo" style="width:100%;">Valider</button>
    <button class="btn secondary" id="btnBackToLogin" style="width:100%;margin-top:8px;">Retour</button>
    <div class="lock-error" id="recoverError"></div>
  </div></div>`;
}
function attachLockRecoverHandlers(){
  const back = document.getElementById('btnBackToLogin');
  if(back) back.onclick = ()=>{ lockMode='login'; renderLock(); };
  const go = document.getElementById('btnRecoverGo');
  if(go) go.onclick = async ()=>{
    const ans = document.getElementById('recoverAnswer').value.trim().toLowerCase();
    const err = document.getElementById('recoverError');
    const auth = SETTINGS.auth;
    const hash = await sha256Hex(ans);
    if(hash===auth.secretAnswerHash){
      lockMode='reset'; renderLock();
    } else {
      err.textContent = 'Réponse incorrecte.';
    }
  };
}

function lockResetHTML(){
  return `<div class="lock-wrap"><div class="lock-card">
    <h2>Nouveau mot de passe</h2>
    <div class="lock-sub">Choisis un nouveau mot de passe pour ton carnet.</div>
    <div class="field"><label>Nouveau mot de passe</label><input type="password" id="resetPw"></div>
    <div class="field"><label>Confirmer</label><input type="password" id="resetPw2"></div>
    <button class="btn" id="btnResetGo" style="width:100%;">Réinitialiser et ouvrir</button>
    <div class="lock-error" id="resetError"></div>
  </div></div>`;
}
function attachLockResetHandlers(){
  document.getElementById('btnResetGo').onclick = async ()=>{
    const p1 = document.getElementById('resetPw').value;
    const p2 = document.getElementById('resetPw2').value;
    const err = document.getElementById('resetError');
    if(!p1 || p1!==p2){ err.textContent='Les mots de passe ne correspondent pas.'; return; }
    if(p1.length<4){ err.textContent='Mot de passe trop court (4 caractères minimum).'; return; }
    SETTINGS.auth.hash = await sha256Hex(p1);
    await saveSettings();
    lockMode='login';
    unlockApp();
  };
}

function unlockApp(){
  document.getElementById('lockScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('fabAdd').style.display = 'flex';
  renderTabs();
  renderView();
  checkReminders();
  if(!window._reminderInterval) window._reminderInterval = setInterval(checkReminders, 30*60*1000);
}

async function changePassword(){
  const cur = document.getElementById('pwCurrent').value;
  const n1 = document.getElementById('pwNew').value;
  const n2 = document.getElementById('pwNew2').value;
  const status = document.getElementById('pwStatus');
  const auth = SETTINGS.auth || {};
  const curHash = await sha256Hex(cur);
  if(curHash!==auth.hash){ status.textContent='Mot de passe actuel incorrect.'; return; }
  if(!n1 || n1!==n2){ status.textContent='Les nouveaux mots de passe ne correspondent pas.'; return; }
  SETTINGS.auth.hash = await sha256Hex(n1);
  await saveSettings();
  status.textContent = 'Mot de passe mis à jour.';
  document.getElementById('pwCurrent').value='';
  document.getElementById('pwNew').value='';
  document.getElementById('pwNew2').value='';
}

async function saveSecretQuestion(){
  const q = document.getElementById('secQuestion').value.trim();
  const a = document.getElementById('secAnswer').value.trim();
  const status = document.getElementById('secStatus');
  if(!q){ status.textContent='La question ne peut pas être vide.'; return; }
  SETTINGS.auth.secretQuestion = q;
  if(a) SETTINGS.auth.secretAnswerHash = await sha256Hex(a.toLowerCase());
  await saveSettings();
  status.textContent = 'Question secrète enregistrée.';
  document.getElementById('secAnswer').value='';
}

async function toggleNotifications(e){
  const enabled = e.target.checked;
  const status = document.getElementById('notifStatus');
  if(enabled && 'Notification' in window){
    const perm = await Notification.requestPermission();
    if(perm!=='granted'){
      status.textContent = "Autorisation refusée par le navigateur — les rappels resteront désactivés.";
      e.target.checked = false;
      return;
    }
  }
  SETTINGS.notifications = {...(SETTINGS.notifications||{}), enabled};
  await saveSettings();
  status.textContent = enabled ? 'Rappels activés (tant que l\'appli reste ouverte).' : 'Rappels désactivés.';
}

function checkReminders(){
  const notif = SETTINGS.notifications || {};
  if(!notif.enabled || !('Notification' in window) || Notification.permission!=='granted') return;
  const already = localStorage.getItem(STORAGE_PREFIX+'reminder-shown-'+todayISO());
  if(already) return;
  const todays = PLAN.filter(p=>p.date===todayISO() && !p.linkedSessionId);
  if(!todays.length) return;
  const list = todays.map(p=>SPORTS[p.sport].label).join(', ');
  new Notification('Séance au programme aujourd\'hui', {body:list});
  localStorage.setItem(STORAGE_PREFIX+'reminder-shown-'+todayISO(), '1');
}

async function saveGoals(){
  const status = document.getElementById('goalsStatus');
  const goals = {};
  Object.keys(SPORTS).forEach(k=>{
    const v = Number(document.getElementById('goal-'+k).value)||0;
    if(v>0) goals[k] = {sessions:v};
  });
  SETTINGS.goals = goals;
  await saveSettings();
  status.textContent = 'Objectifs enregistrés.';
  if(currentTab==='dashboard') renderView();
}

/* ============ INIT ============ */
async function init(){
  SESSIONS = await loadKey('sessions', []);
  PLAN = await loadKey('plan', []);
  SETTINGS = await loadKey('settings', {});
  renderLock();
  document.getElementById('fabAdd').onclick = openQuickAdd;
  document.getElementById('modalBackdrop').onclick = (e)=>{ if(e.target.id==='modalBackdrop') closeModal(); };
  await handleStravaCallback();
}
init();
