<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF9F3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Carnet">
<meta name="mobile-web-app-capable" content="yes">
<title>Carnet d'entrainement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{
  --paper:#FBF9F3;
  --surface:#FFFFFF;
  --surface-2:#F1EEE5;
  --line:#EAE6DB;
  --border:#D8D3C6;
  --ink:#14140F;
  --text:#14140F;
  --dim:#6B685F;
  --faint:#8A8578;
  --ghost:#C6C1B2;
  --aviron:#14657A;
  --velo:#96620F;
  --course:#A93A2C;
  --muscu:#574B92;
  --bar:76px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;overflow:hidden;}
body{
  background:var(--paper);color:var(--text);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{font-family:'Space Grotesk',system-ui,sans-serif;color:var(--ink);margin:0;}
.mono{font-family:'JetBrains Mono',monospace;}
a{color:var(--aviron);font-weight:600;text-decoration:none;}
a:hover{color:#0E4D5C;text-decoration:underline;}
button{font-family:inherit;cursor:pointer;color:inherit;}
input,select,textarea{font-family:inherit;font-size:15px;}
:focus-visible{outline:2px solid var(--aviron);outline-offset:2px;}

/* ---------- coquille ---------- */
#app{display:none;flex-direction:column;height:100%;max-width:520px;margin:0 auto;position:relative;background:var(--paper);}
header.top{
  flex:none;padding:calc(12px + env(safe-area-inset-top)) 22px 10px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.brand{font-family:'Space Grotesk',system-ui,sans-serif;font-size:17px;font-weight:700;letter-spacing:-0.01em;}
#swipe{flex:1;overflow:hidden;position:relative;touch-action:pan-y;}
#track{display:flex;width:500%;height:100%;will-change:transform;}
.pane{
  width:20%;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:6px 22px calc(96px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:26px;
}
.pane::-webkit-scrollbar{width:0;}
nav.tabbar{
  flex:none;display:grid;grid-template-columns:repeat(5,1fr);
  background:var(--paper);border-top:1px solid #E4E0D4;
  padding:9px 4px calc(10px + env(safe-area-inset-bottom));
}
nav.tabbar button{
  background:none;border:none;padding:5px 0;display:flex;flex-direction:column;align-items:center;gap:5px;
  font-size:10.5px;font-weight:500;color:var(--faint);transition:color .18s;
}
nav.tabbar button i{width:18px;height:18px;border-radius:4px;border:2px solid var(--faint);display:block;transition:all .18s;}
nav.tabbar button.on{color:var(--ink);font-weight:700;}
nav.tabbar button.on i{background:var(--ink);border-color:var(--ink);}
.fab{
  position:absolute;right:20px;bottom:calc(var(--bar) + 18px + env(safe-area-inset-bottom));
  width:56px;height:56px;border-radius:50%;background:var(--ink);color:#fff;border:none;
  box-shadow:0 8px 22px -6px rgba(20,20,15,.5);z-index:20;
  display:flex;align-items:center;justify-content:center;font:300 30px/1 'Space Grotesk',system-ui;
}
.fab:active{transform:scale(.94);}

/* ---------- éléments communs ---------- */
.kicker{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:600;}
.h-page{font-size:25px;line-height:1.15;letter-spacing:-0.02em;font-weight:700;}
.big{font-family:'Space Grotesk',system-ui,sans-serif;font-weight:700;letter-spacing:-0.03em;}
.sub{font-size:13px;line-height:1.35;color:var(--dim);}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block;}
.dot.plan{background:none !important;border:2px solid currentColor;}
.rowline{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);}
.rowline:last-child{border-bottom:none;}
.rowline .t{font-size:15px;font-weight:500;line-height:1.3;}
.rowline .s{font-size:12px;color:var(--faint);margin-top:1px;}
.daykey{font:600 12.5px 'JetBrains Mono',monospace;color:var(--faint);width:46px;flex:none;}
.val{font:600 13px 'JetBrains Mono',monospace;color:var(--dim);}
.card{background:var(--surface);border-radius:14px;padding:16px;box-shadow:0 1px 2px rgba(20,20,15,.06);}
.list{background:var(--surface);border-radius:14px;overflow:hidden;box-shadow:0 1px 2px rgba(20,20,15,.06);}
.list-item{display:flex;align-items:center;gap:12px;padding:15px 16px;border-bottom:1px solid var(--surface-2);width:100%;background:none;border-left:none;border-right:none;border-top:none;text-align:left;}
.list-item:last-child{border-bottom:none;}
.list-item .t{font-size:15.5px;font-weight:500;}
.list-item .s{font-size:12.5px;color:var(--faint);margin-top:2px;}
.list-item .chev{color:var(--ghost);}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  background:var(--ink);color:#fff;border:none;padding:14px 18px;border-radius:11px;
  font-weight:700;font-size:14.5px;min-height:48px;transition:background .15s;
}
.btn:hover{background:#2C2A22;}
.btn:disabled{opacity:.45;}
.btn.sec{background:var(--surface);color:var(--ink);border:1.5px solid var(--border);font-weight:600;}
.btn.sec:hover{background:var(--surface-2);}
.btn.ghost{background:none;border:1.5px solid var(--border);color:var(--ink);font-weight:600;}
.btn.ghost:hover{background:var(--surface-2);}
.btn.small{padding:9px 12px;min-height:40px;font-size:12.5px;border-radius:8px;}
.btn.block{width:100%;}
.btn.danger{background:#FBEAE8;color:var(--course);border:1.5px solid var(--course);}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;}
.chips::-webkit-scrollbar{height:0;}
.chip{border:1.5px solid var(--border);border-radius:999px;padding:9px 14px;font-size:13px;font-weight:600;color:#4A473F;white-space:nowrap;background:none;}
.chip.on{border:2px solid var(--ink);color:var(--ink);font-weight:700;}
.seg{display:flex;background:var(--surface-2);border-radius:11px;padding:3px;}
.seg button{flex:1;border:none;background:none;padding:9px 4px;border-radius:8px;font-size:13px;font-weight:600;color:var(--dim);}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(20,20,15,.12);}
.empty{color:var(--faint);font-size:14px;padding:22px 0;text-align:center;}
.hint{font-size:12.5px;color:var(--faint);line-height:1.5;}
.status{font-size:12.5px;color:var(--aviron);line-height:1.5;min-height:16px;margin-top:8px;font-weight:600;}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;}
.bar > i{display:block;height:100%;background:var(--ink);}
.field{margin-bottom:14px;}
.field label{display:block;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:600;margin-bottom:7px;}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=month],select,textarea{
  width:100%;background:var(--surface);border:1.5px solid var(--border);color:var(--text);
  padding:13px;border-radius:10px;min-height:48px;
}
textarea{min-height:70px;resize:vertical;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink);}
input[type=file]{font-size:14px;}
.switch{width:46px;height:28px;border-radius:14px;background:var(--border);position:relative;flex:none;border:none;padding:0;transition:background .18s;}
.switch i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .18s;}
.switch.on{background:var(--ink);}
.switch.on i{left:21px;}

/* ---------- semaine ---------- */
.weekbars{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;align-items:end;height:76px;}
.weekbars > button{background:none;border:none;padding:0;display:flex;flex-direction:column;justify-content:flex-end;gap:5px;height:100%;}
.weekbars .b{border-radius:3px;min-height:3px;}
.weekbars .l{font-size:10.5px;font-weight:600;text-align:center;color:var(--faint);}
.weekbars .l.today{color:var(--ink);font-weight:700;}

/* ---------- calendrier ---------- */
.cal-head{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:6px;}
.cal-head div{text-align:center;font-size:11px;font-weight:600;color:var(--ghost);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
.cal-cell{
  aspect-ratio:1;border:none;background:none;border-radius:11px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  font:600 14px 'JetBrains Mono',monospace;color:var(--text);
}
.cal-cell.out{color:var(--ghost);}
.cal-cell.today{box-shadow:inset 0 0 0 2px var(--border);}
.cal-cell.sel{background:var(--ink);color:#fff;}
.cal-cell .dots{display:flex;gap:3px;height:6px;align-items:center;}
.cal-cell .d{width:6px;height:6px;border-radius:50%;}

/* ---------- récap ---------- */
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.stats3 .n{font-family:'Space Grotesk',system-ui,sans-serif;font-size:24px;font-weight:700;line-height:1;}
.stats3 .l{font-size:11.5px;color:var(--faint);margin-top:4px;}
.tbl-head{display:grid;grid-template-columns:1fr 40px 56px 46px;gap:8px;padding-bottom:8px;border-bottom:2px solid var(--ink);}
.tbl-head div{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ghost);font-weight:600;}
.tbl-row{display:grid;grid-template-columns:1fr 40px 56px 46px;gap:8px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);}
.tbl-row .n{font:600 13px 'JetBrains Mono',monospace;text-align:right;}
.tbl-row .p{font-size:12.5px;font-weight:700;text-align:right;}
.tbl-row .pb{height:3px;border-radius:2px;background:var(--line);margin-top:3px;overflow:hidden;}
.axis{display:flex;justify-content:space-between;margin-top:6px;font:500 11px 'JetBrains Mono',monospace;color:var(--ghost);}

/* ---------- feuille modale ---------- */
.sheet-backdrop{
  position:fixed;inset:0;background:rgba(20,20,15,.5);z-index:50;
  display:none;align-items:flex-end;justify-content:center;
}
.sheet-backdrop.open{display:flex;}
.sheet{
  background:var(--paper);width:100%;max-width:520px;max-height:92vh;overflow-y:auto;
  border-radius:20px 20px 0 0;padding:16px 22px calc(24px + env(safe-area-inset-bottom));
  animation:rise .22s cubic-bezier(.22,.61,.36,1);
}
@keyframes rise{from{transform:translateY(24px);opacity:.6;}to{transform:none;opacity:1;}}
@media (min-width:640px){
  .sheet-backdrop{align-items:center;}
  .sheet{border-radius:18px;max-height:88vh;}
}
.grab{width:38px;height:4px;border-radius:2px;background:var(--border);margin:0 auto 14px;}
.sheet-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:20px;}
.sheet-head h2{font-size:22px;line-height:1.15;}
.sheet-close{background:none;border:none;font-size:14px;font-weight:600;color:var(--aviron);padding:6px 0;}
.sportpick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.sportpick button{border:1.5px solid var(--border);background:var(--surface);border-radius:10px;padding:12px 4px;font-size:12.5px;font-weight:600;min-height:52px;}
.sportpick button.on{color:#fff;font-weight:700;border-width:2px;}
.quick{display:flex;gap:8px;}
.quick button{flex:1;border:1.5px solid var(--border);background:var(--surface);border-radius:10px;padding:12px 2px;font-size:13.5px;font-weight:600;min-height:46px;}
.quick button.on{border:2px solid var(--ink);font-weight:700;}
.rpe{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;}
.rpe button{height:36px;border:none;border-radius:6px;background:var(--line);font-size:11px;color:var(--dim);padding:0;}
.rpe button.on{background:var(--ink);color:#fff;font-weight:700;}
.feel{display:flex;gap:6px;}
.feel button{flex:1;border:1.5px solid var(--border);background:var(--surface);border-radius:10px;min-height:48px;font-size:14px;color:var(--dim);}
.feel button.on{border:2px solid var(--ink);color:var(--ink);font-weight:700;}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:14px;}
.opt-head{display:flex;align-items:center;justify-content:space-between;width:100%;background:none;border:none;padding:14px 0;border-top:1px solid var(--line);font-size:14.5px;font-weight:600;}

/* ---------- verrouillage ---------- */
#lockScreen{height:100%;overflow-y:auto;display:none;}
.lock-wrap{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:32px 26px calc(32px + env(safe-area-inset-bottom));max-width:460px;margin:0 auto;}
.lock-wrap h1{font-size:27px;line-height:1.15;letter-spacing:-0.02em;margin:22px 0 6px;}
.lock-sub{font-size:14.5px;line-height:1.55;color:var(--dim);margin-bottom:28px;}
.lock-error{color:var(--course);font-size:13px;font-weight:600;margin-top:10px;min-height:16px;}
</style>
</head>
<body>

<div id="lockScreen"></div>

<div id="app">
  <header class="top">
    <div class="brand">Carnet d'entrainement</div>
  </header>
  <div id="swipe">
    <div id="track">
      <section class="pane" id="pane0"></section>
      <section class="pane" id="pane1"></section>
      <section class="pane" id="pane2"></section>
      <section class="pane" id="pane3"></section>
      <section class="pane" id="pane4"></section>
    </div>
  </div>
  <button class="fab" id="fabAdd" title="Ajouter une séance">+</button>
  <nav class="tabbar" id="tabbar"></nav>
</div>

<div class="sheet-backdrop" id="sheetBackdrop"><div class="sheet" id="sheet"></div></div>

<script>
/* ============================================================
   CARNET D'ENTRAINEMENT — application autonome (un seul fichier)
   Données : localStorage de ce navigateur, sur cet appareil.
   ============================================================ */

/* ---------- stockage ---------- */
const STORAGE_PREFIX = 'carnet-entrainement:';
async function loadKey(key, fallback){
  try{
    const raw = localStorage.getItem(STORAGE_PREFIX+key);
    return raw!=null ? JSON.parse(raw) : fallback;
  }catch(e){ console.error('storage read error', key, e); return fallback; }
}
async function saveKey(key, value){
  try{ localStorage.setItem(STORAGE_PREFIX+key, JSON.stringify(value)); }
  catch(e){ console.error('storage write error', key, e); alert("Impossible d'enregistrer : le stockage du navigateur est plein ou bloqué."); }
}
let SESSIONS = [], PLAN = [], SETTINGS = {};
async function saveSessions(){ await saveKey('sessions', SESSIONS); }
async function savePlan(){ await saveKey('plan', PLAN); }
async function saveSettings(){ await saveKey('settings', SETTINGS); }

const SPORTS = {
  aviron:{ label:'Aviron', short:'Aviron', color:'#14657A', metric:'distance' },
  velo:{ label:'Vélo', short:'Vélo', color:'#96620F', metric:'distance' },
  course:{ label:'Course', short:'Course', color:'#A93A2C', metric:'distance' },
  muscu:{ label:'Musculation', short:'Muscu', color:'#574B92', metric:'duration' },
};
const SPORT_KEYS = Object.keys(SPORTS);
function sportColor(k){ return (SPORTS[k]||{}).color || '#6B685F'; }
function sportLabel(k){ return (SPORTS[k]||{}).label || k; }

/* ---------- utilitaires ---------- */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function toLocalISO(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function todayISO(){ return toLocalISO(new Date()); }
function formatDuration(min){
  if(min==null || min==='' || isNaN(min)) return null;
  min = Math.round(Number(min));
  if(min<=0) return null;
  const h = Math.floor(min/60), m = min%60;
  if(h===0) return `${m}min`;
  if(m===0) return `${h}h`;
  return `${h}h${String(m).padStart(2,'0')}`;
}
function formatDurationCompact(min){
  if(min==null || min==='' || isNaN(min)) return null;
  min = Math.round(Number(min));
  if(min<=0) return null;
  const h = Math.floor(min/60), m = min%60;
  if(h===0) return `${m}m`;
  if(m===0) return `${h}h`;
  return `${h}h${String(m).padStart(2,'0')}`;
}
function fmtKm(v){ if(v==null||v==='') return null; const n=Math.round(Number(v)*10)/10; return isNaN(n)||n<=0?null:String(n).replace('.',',')+' km'; }
function fmtDate(d){ const dt=new Date(d+'T00:00:00'); return dt.toLocaleDateString('fr-FR',{day:'2-digit',month:'short'}); }
function fmtDateLong(d){ const dt=new Date(d+'T00:00:00'); return dt.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'}); }
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function startOfWeek(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate()-((d.getDay()+6)%7));
  return d;
}
function isoWeekNum(dateStr){
  const dt = new Date(dateStr+'T00:00:00');
  dt.setHours(0,0,0,0);
  dt.setDate(dt.getDate() + 3 - ((dt.getDay()+6)%7));
  const week1 = new Date(dt.getFullYear(),0,4);
  return 1 + Math.round(((dt-week1)/86400000 - 3 + ((week1.getDay()+6)%7))/7);
}
function weekRange(dateStr){
  const mon = startOfWeek(dateStr);
  const sun = new Date(mon); sun.setDate(mon.getDate()+6);
  return [toLocalISO(mon), toLocalISO(sun)];
}
function inRange(d, a, b){ return d>=a && d<=b; }

/* ============================================================
   COQUILLE — onglets, balayage, rendu
   ============================================================ */
const TABS = [
  {id:'aujourdhui', label:"Aujourd'hui"},
  {id:'calendrier', label:'Calendrier'},
  {id:'programme',  label:'Programme'},
  {id:'recap',      label:'Récap'},
  {id:'reglages',   label:'Réglages'},
];
let tabIndex = 0;
let calDate = new Date();
let calSelected = null;
let planFilter = 'semaine';
let recapPeriod = 'semaine';
let recapSport = 'tous';
let settingsPage = null;

function renderTabbar(){
  document.getElementById('tabbar').innerHTML = TABS.map((t,i)=>
    `<button data-act="tab" data-i="${i}" class="${i===tabIndex?'on':''}"><i></i><span>${t.label}</span></button>`
  ).join('');
}
function setTrack(px, animate){
  const track = document.getElementById('track');
  track.style.transition = animate===false ? 'none' : 'transform .3s cubic-bezier(.22,.61,.36,1)';
  track.style.transform = `translateX(calc(${-tabIndex*20}% + ${px||0}px))`;
}
function goTab(i, keepScroll){
  i = Math.max(0, Math.min(TABS.length-1, i));
  tabIndex = i;
  renderTabbar();
  setTrack(0, true);
  renderAll();
  if(!keepScroll){ const p = document.getElementById('pane'+i); if(p) p.scrollTop = 0; }
}
function renderAll(){
  document.getElementById('pane0').innerHTML = viewAujourdhui();
  document.getElementById('pane1').innerHTML = viewCalendrier();
  document.getElementById('pane2').innerHTML = viewProgramme();
  document.getElementById('pane3').innerHTML = viewRecap();
  document.getElementById('pane4').innerHTML = viewReglages();
}

/* balayage gauche / droite entre les onglets */
(function initSwipe(){
  let st = null;
  const el = () => document.getElementById('swipe');
  document.addEventListener('pointerdown', e=>{
    const zone = el(); if(!zone || !zone.contains(e.target)) return;
    if(document.getElementById('sheetBackdrop').classList.contains('open')) return;
    if(e.target.closest('input,textarea,select,.chips')) return;
    st = {x:e.clientX, y:e.clientY, w:zone.clientWidth, axis:null};
  });
  document.addEventListener('pointermove', e=>{
    if(!st) return;
    const dx = e.clientX-st.x, dy = e.clientY-st.y;
    if(!st.axis){
      if(Math.abs(dx)<8 && Math.abs(dy)<8) return;
      st.axis = Math.abs(dx)>Math.abs(dy) ? 'x' : 'y';
    }
    if(st.axis!=='x') return;
    let d = dx;
    if((tabIndex===0 && d>0) || (tabIndex===TABS.length-1 && d<0)) d *= .28;
    st.d = d;
    setTrack(d, false);
  });
  const end = ()=>{
    if(!st){ return; }
    const s = st; st = null;
    if(s.axis!=='x'){ return; }
    const thr = Math.min(90, s.w*0.22);
    const d = s.d||0;
    if(d < -thr) goTab(tabIndex+1);
    else if(d > thr) goTab(tabIndex-1);
    else setTrack(0, true);
  };
  document.addEventListener('pointerup', end);
  document.addEventListener('pointercancel', end);
})();

/* ============================================================
   ONGLET 1 — AUJOURD'HUI
   ============================================================ */
function weekData(refISO){
  const mon = startOfWeek(refISO);
  const labels = ['L','M','M','J','V','S','D'];
  const days = [];
  for(let i=0;i<7;i++){
    const d = new Date(mon); d.setDate(mon.getDate()+i);
    const iso = toLocalISO(d);
    const done = SESSIONS.filter(s=>s.date===iso);
    const planned = PLAN.filter(p=>p.date===iso && !p.linkedSessionId);
    days.push({
      iso, label:labels[i], num:d.getDate(),
      duration: done.reduce((a,s)=>a+(Number(s.duration)||0),0),
      plannedDuration: planned.reduce((a,p)=>a+(Number(p.targetDuration)||0),0),
      done, planned,
    });
  }
  return days;
}

function viewAujourdhui(){
  const today = todayISO();
  const days = weekData(today);
  const total = days.reduce((a,d)=>a+d.duration,0);
  const count = days.reduce((a,d)=>a+d.done.length,0);
  const goals = SETTINGS.goals || {};
  const goalTotal = Object.values(goals).reduce((a,g)=>a+(g.sessions||0),0);
  const maxBar = Math.max(...days.map(d=>Math.max(d.duration, d.plannedDuration)), 60);

  const bars = days.map(d=>{
    const hDone = Math.max(3, Math.round(d.duration/maxBar*70));
    const hPlan = Math.max(3, Math.round(d.plannedDuration/maxBar*70));
    let inner = '';
    if(d.duration>0){
      const c = sportColor(d.done[0].sport);
      inner = `<div class="b" style="height:${hDone}px;background:${c};"></div>`;
    } else if(d.plannedDuration>0 || d.planned.length){
      const c = sportColor(d.planned[0].sport);
      inner = `<div class="b" style="height:${d.plannedDuration>0?hPlan:20}px;border:1.5px dashed ${c};"></div>`;
    } else {
      inner = `<div class="b" style="height:3px;background:#DCD8CC;"></div>`;
    }
    return `<button data-act="goday" data-d="${d.iso}">${inner}<div class="l ${d.iso===today?'today':''}">${d.label}</div></button>`;
  }).join('');

  const todaySessions = SESSIONS.filter(s=>s.date===today);
  const todayPlans = PLAN.filter(p=>p.date===today && !p.linkedSessionId);

  let todayBlock = '';
  if(todayPlans.length){
    todayBlock += todayPlans.map(p=>`
      <div class="card" style="display:flex;flex-direction:column;gap:14px;margin-bottom:12px;">
        <div style="display:flex;align-items:flex-start;gap:10px;">

          <div style="flex:1;">
            <div style="font-size:16px;font-weight:600;line-height:1.25;">${esc(p.title||sportLabel(p.sport))}</div>
            <div class="sub" style="margin-top:2px;">Prévue au programme${p.targetDuration?' · '+formatDuration(p.targetDuration):''}${p.targetDistance?' · '+fmtKm(p.targetDistance):''}</div>
          </div>
        </div>
        <div style="display:flex;gap:8px;">
          <button class="btn" style="flex:1;" data-act="mark-done" data-id="${p.id}">Marquer réalisée</button>
          <button class="btn sec" data-act="edit-plan" data-id="${p.id}">Détails</button>
        </div>
      </div>`).join('');
  }
  if(todaySessions.length){
    todayBlock += `<div>${todaySessions.map(s=>`
      <button class="rowline" style="width:100%;background:none;border-top:none;border-left:none;border-right:none;text-align:left;" data-act="edit-session" data-id="${s.id}">
        <span class="dot" style="background:${sportColor(s.sport)}"></span>
        <div style="flex:1;"><div class="t">${sportLabel(s.sport)}${s.notes?' — '+esc(s.notes.split('\n')[0].slice(0,40)):''}</div></div>
        <span class="val">${formatDuration(s.duration)||'fait'}</span>
      </button>`).join('')}</div>`;
  }
  if(!todayBlock){
    todayBlock = `<div class="card" style="text-align:center;">
      <div class="sub" style="margin-bottom:14px;">Rien de prévu aujourd'hui.</div>
      <button class="btn ghost block" data-act="add-session" data-d="${today}">Ajouter une séance</button>
    </div>`;
  }

  const upcoming = PLAN.filter(p=>!p.linkedSessionId && p.date>today).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,4);

  return `
  <div>
    <div class="kicker">${cap(fmtDateLong(today))}</div>
    <h1 class="h-page" style="margin-top:4px;">Semaine ${isoWeekNum(today)}</h1>
  </div>

  <div>
    <div style="display:flex;align-items:flex-end;gap:14px;margin-bottom:14px;">
      <div class="big" style="font-size:40px;line-height:.9;">${formatDuration(total)||'0min'}</div>
      <div class="sub" style="padding-bottom:3px;">${count} séance${count>1?'s':''} cette semaine${goalTotal?`<br>objectif ${goalTotal} séance${goalTotal>1?'s':''}`:''}</div>
    </div>
    <div class="weekbars">${bars}</div>
  </div>

  <div>
    <div class="kicker" style="margin-bottom:10px;">Aujourd'hui</div>
    ${todayBlock}
  </div>

  <div>
    <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px;">
      <div class="kicker">À venir</div>
      <button class="sheet-close" data-act="tab" data-i="2">Tout le programme</button>
    </div>
    ${upcoming.length ? upcoming.map(p=>`
      <button class="rowline" style="width:100%;background:none;border-top:none;border-left:none;border-right:none;text-align:left;" data-act="edit-plan" data-id="${p.id}">
        <span class="daykey">${fmtDate(p.date).toUpperCase()}</span>
        <span class="dot plan" style="color:${sportColor(p.sport)}"></span>
        <div style="flex:1;"><div class="t">${esc(p.title||sportLabel(p.sport))}</div></div>
        <span class="val">${formatDuration(p.targetDuration)||fmtKm(p.targetDistance)||''}</span>
      </button>`).join('')
      : `<div class="empty">Aucune séance planifiée. Importe ton programme depuis Réglages.</div>`}
  </div>`;
}

/* ============================================================
   ONGLET 2 — CALENDRIER

function viewCalendrier(){
  const year = calDate.getFullYear(), month = calDate.getMonth();
  const first = new Date(year, month, 1);
  const offset = (first.getDay()+6)%7;
  const gridStart = new Date(year, month, 1-offset);
  const todayIso = todayISO();
  const sel = calSelected || todayIso;

  let cells = '';
  for(let i=0;i<42;i++){
    const d = new Date(gridStart); d.setDate(gridStart.getDate()+i);
    const iso = toLocalISO(d);
    const out = d.getMonth()!==month;
    const done = SESSIONS.filter(s=>s.date===iso);
    const planned = PLAN.filter(p=>p.date===iso && !p.linkedSessionId);
    const dots = [
      ...done.slice(0,3).map(s=>`<span class="d" style="background:${sportColor(s.sport)}"></span>`),
      ...planned.slice(0,3-Math.min(3,done.length)).map(p=>`<span class="d" style="border:1.5px solid ${sportColor(p.sport)}"></span>`),
    ].join('');
    cells += `<button class="cal-cell ${out?'out':''} ${iso===todayIso?'today':''} ${iso===sel?'sel':''}" data-act="cal-day" data-d="${iso}">
      ${d.getDate()}<span class="dots">${dots}</span></button>`;
  }

  const selSessions = SESSIONS.filter(s=>s.date===sel);
  const selPlans = PLAN.filter(p=>p.date===sel);

  const detail = (selSessions.length||selPlans.length) ? `
    ${selPlans.filter(p=>!p.linkedSessionId).map(p=>`
      <div style="border:1.5px dashed var(--border);border-radius:12px;padding:14px;display:flex;align-items:center;gap:12px;">

          <div style="font-size:15px;font-weight:600;line-height:1.3;">${esc(p.title||sportLabel(p.sport))}</div>

        </div>
        <button class="btn small" data-act="mark-done" data-id="${p.id}">Réalisée</button>
      </div>`).join('')}
    ${selSessions.map(s=>`
      <button class="card" style="display:flex;align-items:center;gap:12px;width:100%;border:none;text-align:left;" data-act="edit-session" data-id="${s.id}">
        <span class="dot" style="background:${sportColor(s.sport)}"></span>
        <div style="flex:1;">
          <div style="font-size:15px;font-weight:600;line-height:1.3;">${sportLabel(s.sport)}${s.notes?' — '+esc(s.notes.split('\n')[0].slice(0,32)):''}</div>
          <div class="hint" style="margin-top:2px;">${[formatDuration(s.duration), fmtKm(s.distance), s.rpe?'RPE '+s.rpe:null, s.completion!=null?s.completion+' % du planning':null].filter(Boolean).join(' · ')||'Séance réalisée'}</div>
        </div>

  ` : `<div class="empty">Rien ce jour-là.</div>`;

  return `
  <div style="display:flex;align-items:center;justify-content:space-between;">
    <h1 class="h-page">${cap(first.toLocaleDateString('fr-FR',{month:'long',year:'numeric'}))}</h1>

      <button class="btn ghost" style="width:40px;height:40px;min-height:40px;padding:0;border-radius:10px;" data-act="cal-nav" data-n="-1">‹</button>

/* ============================================================
   ONGLET 3 — PROGRAMME
   ============================================================ */
function planCompletion(p){
  if(!p.linkedSessionId) return null;
  const s = SESSIONS.find(x=>x.id===p.linkedSessionId);
  if(!s) return null;
  if(s.completion!=null) return s.completion;
  const metric = SPORTS[p.sport].metric;
  if(metric==='distance' && p.targetDistance && s.distance) return Math.round(s.distance/p.targetDistance*100);
  if(p.targetDuration && s.duration) return Math.round(s.duration/p.targetDuration*100);
  return 100;
}

function viewProgramme(){
  const today = todayISO();
  const [monISO, sunISO] = weekRange(today);
  let list = PLAN.slice().sort((a,b)=>a.date.localeCompare(b.date));
  if(planFilter==='semaine') list = list.filter(p=>inRange(p.date, monISO, sunISO));
  else if(planFilter==='avenir') list = list.filter(p=>p.date>sunISO);
  else if(planFilter==='passe') list = list.filter(p=>p.date<monISO).reverse();

  const doneAll = PLAN.filter(p=>p.linkedSessionId).length;
  const pct = PLAN.length ? Math.round(doneAll/PLAN.length*100) : 0;

  const groups = {};
  list.forEach(p=>{
    const k = isoWeekNum(p.date)+'|'+startOfWeek(p.date).getFullYear();
    (groups[k] = groups[k] || []).push(p);
  });

  const body = Object.keys(groups).length ? Object.entries(groups).map(([k, items])=>{
    const wk = k.split('|')[0];
    const dur = items.reduce((a,p)=>a+(Number(p.targetDuration)||0),0);
    const doneN = items.filter(p=>p.linkedSessionId).length;
    return `
    <div>
      <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px;">
        <div class="kicker">Semaine ${wk} · ${doneN} sur ${items.length}</div>
        <span class="val">${formatDuration(dur)||''}</span>
      </div>
      ${items.map(p=>{
        const c = planCompletion(p);
        const isToday = p.date===today && !p.linkedSessionId;
        return `<div class="rowline" style="${isToday?'background:#FFF7F5;':''}">
          <span class="daykey">${fmtDate(p.date).toUpperCase()}</span>
          <span class="dot ${p.linkedSessionId?'':'plan'}" style="${p.linkedSessionId?'background:'+sportColor(p.sport):'color:'+sportColor(p.sport)}"></span>
          <button style="flex:1;background:none;border:none;text-align:left;padding:0;min-width:0;" data-act="edit-plan" data-id="${p.id}">
            <div class="t">${esc(p.title||sportLabel(p.sport))}</div>
            <div class="s">${isToday?'à faire aujourd\'hui':[formatDuration(p.targetDuration)?'cible '+formatDuration(p.targetDuration):null, fmtKm(p.targetDistance)].filter(Boolean).join(' / ')||sportLabel(p.sport)}</div>
          </button>
          ${p.linkedSessionId
            ? `<span style="font-size:12px;font-weight:700;color:var(--aviron);">${c!=null?c+' %':'fait'}</span>`
            : `<button class="btn small" data-act="mark-done" data-id="${p.id}">Réalisée</button>`}
        </div>`;
      }).join('')}
    </div>`;
  }).join('') : `<div class="empty">Aucune séance sur cette période.</div>`;

  return `
  <div>
    <h1 class="h-page" style="margin-bottom:14px;">Programme</h1>
    <div style="display:flex;align-items:flex-end;gap:12px;">
      <div class="big" style="font-size:34px;line-height:.9;">${pct} %</div>
      <div class="sub" style="padding-bottom:3px;">réalisé sur l'ensemble du programme<br>${doneAll} séance${doneAll>1?'s':''} sur ${PLAN.length}</div>
    </div>
    <div class="bar" style="margin-top:12px;"><i style="width:${pct}%;"></i></div>
  </div>

  <div class="chips">
    <button class="chip ${planFilter==='semaine'?'on':''}" data-act="plan-filter" data-v="semaine">Cette semaine</button>
    <button class="chip ${planFilter==='avenir'?'on':''}" data-act="plan-filter" data-v="avenir">À venir</button>
    <button class="chip ${planFilter==='passe'?'on':''}" data-act="plan-filter" data-v="passe">Passé</button>
    <button class="chip ${planFilter==='tout'?'on':''}" data-act="plan-filter" data-v="tout">Tout</button>
  </div>

  <div style="display:flex;flex-direction:column;gap:24px;">${body}</div>

  <div style="display:flex;gap:10px;">
    <button class="btn sec" style="flex:1;" data-act="open-import">Importer un programme</button>
    <button class="btn sec" data-act="add-plan">+ Séance</button>
  </div>`;
}

/* ============================================================
   ONGLET 4 — RÉCAP
   ============================================================ */
function recapRange(){
  const today = todayISO();
  if(recapPeriod==='semaine'){
    const [a,b] = weekRange(today);
    return {a, b, title:`Semaine ${isoWeekNum(today)} · ${fmtDate(a)} au ${fmtDate(b)}`};
  }
  if(recapPeriod==='mois'){
    const d = new Date();
    const a = toLocalISO(new Date(d.getFullYear(), d.getMonth(), 1));
    const b = toLocalISO(new Date(d.getFullYear(), d.getMonth()+1, 0));
    return {a, b, title:cap(d.toLocaleDateString('fr-FR',{month:'long',year:'numeric'}))};
  }
  const y = new Date().getFullYear();
  return {a:y+'-01-01', b:y+'-12-31', title:'Année '+y};
}

function curveSVG(values, labels, unitLabel){
  const w=320, h=96, pad=4, base=95, top=12;
  const max = Math.max(...values, 1);
  const n = values.length;
  const pts = values.map((v,i)=>{
    const x = n>1 ? pad + i*(w-2*pad)/(n-1) : w/2;
    const y = base - (v/max)*(base-top);
    return `${Math.round(x*10)/10},${Math.round(y*10)/10}`;
  });
  const area = `${pad},${base} ${pts.join(' ')} ${w-pad},${base}`;
  return `
  <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:96px;display:block;" preserveAspectRatio="none">
    <line x1="0" y1="${base}" x2="${w}" y2="${base}" stroke="#DCD8CC" stroke-width="1"></line>
    <line x1="0" y1="${(base+top)/2}" x2="${w}" y2="${(base+top)/2}" stroke="#EAE6DB" stroke-width="1" stroke-dasharray="3 4"></line>
    <polygon points="${area}" fill="rgba(20,20,15,.07)"></polygon>
    <polyline points="${pts.join(' ')}" fill="none" stroke="#14140F" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></polyline>
  </svg>
  <div class="axis"><span>${labels[0]||''}</span><span style="color:var(--faint);">max ${unitLabel}</span><span>${labels[labels.length-1]||''}</span></div>`;
}

function recapSeries(a, b){
  const inP = SESSIONS.filter(s=>inRange(s.date, a, b));
  if(recapPeriod==='semaine'){
    const days = weekData(todayISO());
    return {values: days.map(d=>d.duration), labels:['L','M','M','J','V','S','D']};
  }
  if(recapPeriod==='mois'){
    const buckets = {}, labels = [];
    let cur = startOfWeek(a);
    while(toLocalISO(cur) <= b){
      const k = toLocalISO(cur);
      buckets[k] = 0; labels.push('S'+isoWeekNum(k));
      cur = new Date(cur); cur.setDate(cur.getDate()+7);
    }
    inP.forEach(s=>{
      const k = toLocalISO(startOfWeek(s.date));
      if(k in buckets) buckets[k] += Number(s.duration)||0;
    });
    return {values:Object.values(buckets), labels};
  }
  const months = new Array(12).fill(0);
  inP.forEach(s=>{ months[Number(s.date.slice(5,7))-1] += Number(s.duration)||0; });
  return {values:months, labels:['J','F','M','A','M','J','J','A','S','O','N','D']};
}

function viewRecap(){
  const {a, b, title} = recapRange();
  const inP = SESSIONS.filter(s=>inRange(s.date, a, b)).sort((x,y)=>y.date.localeCompare(x.date));
  const totalDur = inP.reduce((acc,s)=>acc+(Number(s.duration)||0),0);
  const totalKm = inP.reduce((acc,s)=>acc+(Number(s.distance)||0),0);

  const per = {};
  SPORT_KEYS.forEach(k=>per[k]={count:0,duration:0,distance:0});
  inP.forEach(s=>{ const p=per[s.sport]; if(!p) return; p.count++; p.duration+=Number(s.duration)||0; p.distance+=Number(s.distance)||0; });
  const order = SPORT_KEYS.slice().sort((x,y)=>per[y].duration-per[x].duration);

  const {values, labels} = recapSeries(a, b);
  const seriesLabel = recapPeriod==='semaine' ? 'heures par jour' : recapPeriod==='mois' ? 'heures par semaine' : 'heures par mois';

  const rows = order.map(k=>{
    const p = per[k];
    const share = totalDur ? Math.round(p.duration/totalDur*100) : 0;
    return `<div class="tbl-row">
      <div style="display:flex;align-items:center;gap:9px;min-width:0;">
        <span class="dot" style="background:${sportColor(k)}"></span>
        <div style="min-width:0;">
          <div style="font-size:14.5px;font-weight:500;line-height:1.25;">${sportLabel(k)}</div>
          <div style="font-size:11.5px;color:var(--ghost);margin-top:1px;">${fmtKm(p.distance)||'—'}</div>
        </div>
      </div>
      <div class="n">${p.count}</div>
      <div class="n">${formatDuration(p.duration)||'—'}</div>
      <div><div class="p">${share} %</div><div class="pb"><i style="display:block;height:100%;width:${share}%;background:${sportColor(k)}"></i></div></div>
    </div>`;
  }).join('');

  const filtered = recapSport==='tous' ? inP : inP.filter(s=>s.sport===recapSport);
  const activities = filtered.length ? filtered.slice(0,40).map(s=>`
    <button class="rowline" style="width:100%;background:none;border-top:none;border-left:none;border-right:none;text-align:left;" data-act="edit-session" data-id="${s.id}">
      <span class="dot" style="background:${sportColor(s.sport)}"></span>
      <div style="flex:1;min-width:0;">
        <div class="t">${sportLabel(s.sport)}</div>
        <div class="s">${[cap(fmtDate(s.date)), fmtKm(s.distance), s.rpe?'RPE '+s.rpe:null, s.source||'manuel'].filter(Boolean).join(' · ')}</div>
      </div>
      <span class="val">${formatDuration(s.duration)||'—'}</span>
    </button>`).join('') : `<div class="empty">Aucune activité sur cette période.</div>`;

  return `
  <div style="display:flex;align-items:baseline;justify-content:space-between;">
    <h1 class="h-page">Récap</h1>
    <button class="sheet-close" data-act="open-export">Exporter en CSV</button>
  </div>

  <div class="seg">
    <button class="${recapPeriod==='semaine'?'on':''}" data-act="recap-period" data-v="semaine">Semaine</button>
    <button class="${recapPeriod==='mois'?'on':''}" data-act="recap-period" data-v="mois">Mois</button>
    <button class="${recapPeriod==='annee'?'on':''}" data-act="recap-period" data-v="annee">Année</button>
  </div>

  <div>
    <div class="kicker" style="margin-bottom:10px;">${title}</div>
    <div class="stats3">
      <div><div class="n">${formatDuration(totalDur)||'0min'}</div><div class="l">durée</div></div>
      <div><div class="n">${inP.length}</div><div class="l">séances</div></div>
      <div><div class="n">${totalKm?String(Math.round(totalKm*10)/10).replace('.',','):'0'}</div><div class="l">km</div></div>
    </div>
  </div>

  <div>
    <div class="kicker" style="margin-bottom:10px;">Progression — ${seriesLabel}</div>
    ${curveSVG(values, labels, formatDuration(Math.max(...values,1))||'—')}
  </div>

  <div>

function readDraftInputs(){
  const g = id => document.getElementById(id);
  if(g('dfDate')) draft.date = g('dfDate').value || todayISO();
  if(g('dfDuration')) draft.duration = Number(g('dfDuration').value) || null;
  if(g('dfDistance')) draft.distance = Number(g('dfDistance').value) || null;
  if(g('dfNotes')) draft.notes = g('dfNotes').value;
  if(g('dfIntervals')) draft.intervals = g('dfIntervals').value;
  if(g('dfLink')) draft.linkedPlanId = g('dfLink').value;
}

async function saveDraftSession(){
  readDraftInputs();
  let session;
  if(draft.id){
    session = SESSIONS.find(s=>s.id===draft.id);
    if(!session) return;
    if(session.linkedPlanId && session.linkedPlanId!==draft.linkedPlanId){
      const old = PLAN.find(p=>p.id===session.linkedPlanId);
      if(old) old.linkedSessionId = null;
    }
  } else {
    session = {id:uid(), source:'manuel'};
    SESSIONS.push(session);
  }
  session.date = draft.date;
  session.sport = draft.sport;
  session.duration = draft.duration;
  session.distance = draft.sport==='muscu' ? null : draft.distance;
  session.notes = draft.notes || '';
  session.completion = null;
  session.linkedPlanId = null;
  /* champs facultatifs : uniquement s'ils sont renseignés */
  if(draft.rpe) session.rpe = draft.rpe; else delete session.rpe;
  if(draft.feel) session.feel = draft.feel; else delete session.feel;
  if(draft.intervals && draft.intervals.trim()) session.intervals = draft.intervals.trim(); else delete session.intervals;

  if(draft.linkedPlanId){
    const plan = PLAN.find(p=>p.id===draft.linkedPlanId);
    if(plan){
      const metric = SPORTS[session.sport].metric;
      let pct = null;
      if(metric==='distance' && plan.targetDistance && session.distance) pct = Math.round(session.distance/plan.targetDistance*100);
      else if(plan.targetDuration && session.duration) pct = Math.round(session.duration/plan.targetDuration*100);
      session.completion = pct;
      session.linkedPlanId = plan.id;
      plan.linkedSessionId = session.id;
    }
  }
  await saveSessions();
  await savePlan();
  closeSheet();
  renderAll();
}

async function deleteDraftSession(){
  if(!draft.id || !confirm('Supprimer cette séance ?')) return;
  const s = SESSIONS.find(x=>x.id===draft.id);
  if(s && s.linkedPlanId){ const p = PLAN.find(x=>x.id===s.linkedPlanId); if(p) p.linkedSessionId = null; }
  SESSIONS = SESSIONS.filter(x=>x.id!==draft.id);
  await saveSessions();
  await savePlan();
  closeSheet();
  renderAll();
}

function csvEscape(val){
  val = (val===null||val===undefined) ? '' : String(val);
  if(/[";\n]/.test(val)) return '"'+val.replace(/"/g,'""')+'"';
  return val;
}
function exportSessionsCSV(){
  const periodType = document.getElementById('expPeriodType').value;
  const sport = document.getElementById('expSport').value;
  const status = document.getElementById('exportStatus');
  let startIso=null, endIso=null, labelPart='toutes';

  if(periodType==='semaine'){
    const d = document.getElementById('expWeekDate').value || todayISO();
    const [a,b] = weekRange(d);
    startIso=a; endIso=b; labelPart='semaine-du-'+a;
  } else if(periodType==='mois'){
    const m = document.getElementById('expMonth').value;
    if(!m){ status.textContent='Choisis un mois.'; return; }
    const [y,mo] = m.split('-').map(Number);
    startIso = m+'-01';
    endIso = `${m}-${String(new Date(y,mo,0).getDate()).padStart(2,'0')}`;
    labelPart = 'mois-'+m;
  } else if(periodType==='annee'){
    const y = document.getElementById('expYear').value;
    if(!y){ status.textContent="Choisis une année."; return; }
    startIso = y+'-01-01'; endIso = y+'-12-31'; labelPart='annee-'+y;
  }

  let rows = SESSIONS.slice();
  if(startIso && endIso) rows = rows.filter(s=>inRange(s.date, startIso, endIso));
  if(sport!=='tous') rows = rows.filter(s=>s.sport===sport);
  rows.sort((a,b)=>a.date.localeCompare(b.date));
  if(!rows.length){ status.textContent = 'Aucune séance ne correspond à ces critères.'; return; }

  const header = ['Date','Sport','Durée (min)','Durée','Distance (km)','RPE','Ressenti','Fractionné','Réalisation (%)','Source','Notes'];
  const lines = [header.join(';')].concat(rows.map(s=>[
    s.date, sportLabel(s.sport), s.duration||'', formatDuration(s.duration)||'',
    s.distance||'', s.rpe||'', s.feel||'', s.intervals||'',
    s.completion!=null?s.completion:'', s.source||'manuel', s.notes||''
  ].map(csvEscape).join(';')));

  const blob = new Blob(['\ufeff'+lines.join('\r\n')], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `carnet-seances-${labelPart}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
  status.textContent = `${rows.length} séance(s) exportée(s).`;
}

async function importBackup(file, statusEl){
  try{
    const data = JSON.parse(await file.text());
    if(!Array.isArray(data.sessions) || !Array.isArray(data.plan)){
      statusEl.textContent = "Fichier invalide : ce n'est pas une sauvegarde reconnue."; return;
    }
    const merge = confirm(`Importer ${data.sessions.length} séance(s) et ${data.plan.length} entrée(s) de planning ?\nOK = fusionner avec les données existantes. Annuler = remplacer entièrement.`);
    if(merge){
      const ids = new Set(SESSIONS.map(s=>s.id));
      data.sessions.forEach(s=>{ if(!ids.has(s.id)) SESSIONS.push(s); });
      const pids = new Set(PLAN.map(p=>p.id));
      data.plan.forEach(p=>{ if(!pids.has(p.id)) PLAN.push(p); });
    } else {
      SESSIONS = data.sessions; PLAN = data.plan;
    }
    if(data.settings){
      SETTINGS.goals = data.settings.goals || SETTINGS.goals;
      SETTINGS.notifications = data.settings.notifications || SETTINGS.notifications;
    }
    await saveSessions(); await savePlan(); await saveSettings();

    renderAll();
  }catch(e){
    statusEl.textContent = 'Lecture impossible : fichier illisible ou corrompu.';
  }
}

async function handleExcelFile(file){
  const status = document.getElementById('excelStatus');
  status.textContent = 'Lecture du fichier…';
  try{
    const wb = XLSX.read(await file.arrayBuffer(), {type:'array'});
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval:''});
    if(!rows.length){ status.textContent = 'Fichier vide ou illisible.'; return; }
    let added = 0;
    rows.forEach(r=>{
      const keys = Object.keys(r).reduce((acc,k)=>{acc[k.toLowerCase().trim()]=r[k];return acc;},{});
      const dateISO = parseFrenchDate(keys['date']);
      const sport = matchSport((keys['sport']||'').toString());
      if(!dateISO || !sport) return;
      PLAN.push({
        id:uid(), date:dateISO, sport,
        title: keys['titre']||keys['description']||'',
        targetDuration: Number(keys['durée']||keys['duree']||0)||null,
        targetDistance: Number(keys['distance']||0)||null,
        source:'excel', linkedSessionId:null,
      });
      added++;
    });
    await savePlan();
    status.textContent = `${added} séance(s) ajoutée(s) au programme.`;
    renderAll();
  }catch(e){ status.textContent = 'Lecture impossible : format non reconnu.'; }
}
function parseFrenchDate(v){
  if(!v) return null;
  if(v instanceof Date) return toLocalISO(v);
  const s = v.toString().trim();
  let m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
  if(m){ let [_,d,mo,y]=m; if(y.length===2) y='20'+y; return `${y}-${mo.padStart(2,'0')}-${d.padStart(2,'0')}`; }
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m){ let [_,y,mo,d]=m; return `${y}-${mo.padStart(2,'0')}-${d.padStart(2,'0')}`; }
  const dt = new Date(s);
  return isNaN(dt) ? null : toLocalISO(dt);
}
function matchSport(raw){
  raw = (raw||'').toLowerCase();
  if(raw.includes('aviron')||raw.includes('rame')||raw.includes('ergo')||raw.includes('row')) return 'aviron';
  if(raw.includes('vélo')||raw.includes('velo')||raw.includes('bike')||raw.includes('cycl')||raw.includes('ride')) return 'velo';
  if(raw.includes('course')||raw.includes('run')||raw.includes('cap')) return 'course';
  if(raw.includes('muscu')||raw.includes('force')||raw.includes('renfo')||raw.includes('strength')||raw.includes('weight')) return 'muscu';
  return null;
}
async function handlePdfFile(file){
  const area = document.getElementById('pdfArea');
  area.innerHTML = '<div class="hint">Extraction du texte…</div>';
  try{
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const pdf = await pdfjsLib.getDocument({data: await file.arrayBuffer()}).promise;
    let full = '';
    for(let i=1;i<=pdf.numPages;i++){
      const content = await (await pdf.getPage(i)).getTextContent();
      full += content.items.map(it=>it.str).join(' ') + '\n';
    }
    const lines = full.split(/\n|(?=\d{1,2}\/\d{1,2})/).map(l=>l.trim()).filter(Boolean);
    area.innerHTML = `
      <div class="hint" style="margin-bottom:10px;">Texte extrait — corrige si besoin, une ligne par séance : <span class="mono">jj/mm/aaaa | sport | titre | durée(min) | distance(km)</span></div>
      <textarea id="pdfTextArea" rows="10" style="font-family:'JetBrains Mono',monospace;font-size:12px;">${esc(lines.slice(0,60).join('\n'))}</textarea>
      <button class="btn block" data-act="import-pdf" style="margin-top:10px;">Analyser et importer</button>
      <div class="status" id="pdfImportStatus"></div>`;
  }catch(e){ area.innerHTML = '<div class="hint">Lecture du PDF impossible.</div>'; }
}
async function importPdfLines(){
  const lines = document.getElementById('pdfTextArea').value.split('\n').map(l=>l.trim()).filter(Boolean);
  const status = document.getElementById('pdfImportStatus');
  let added = 0;
  lines.forEach(line=>{
    const parts = line.split('|').map(p=>p.trim());
    let dateISO=null, sport=null, title='', duration=null, distance=null;
    if(parts.length>=2){
      dateISO = parseFrenchDate(parts[0]);
      sport = matchSport(parts[1]||'');
      title = parts[2]||'';
      duration = Number(parts[3])||null;
      distance = Number(parts[4])||null;
    } else {
      const dm = line.match(/(\d{1,2}\/\d{1,2}\/\d{2,4}|\d{1,2}\/\d{1,2})/);
      dateISO = dm ? parseFrenchDate(dm[1].split('/').length===2 ? dm[1]+'/'+new Date().getFullYear() : dm[1]) : null;
      sport = matchSport(line);
      title = line;
    }
    if(dateISO && sport){
      PLAN.push({id:uid(), date:dateISO, sport, title, targetDuration:duration, targetDistance:distance, source:'pdf', linkedSessionId:null});
      added++;
    }
  });
  await savePlan();
  status.textContent = `${added} ligne(s) importée(s) sur ${lines.length}. Vérifie le résultat dans l'onglet Programme.`;
  renderAll();
}

async function stravaConnect(){
  const workerUrl = document.getElementById('stravaWorkerUrl').value.trim().replace(/\/$/,'');
  const clientId = document.getElementById('stravaClientId').value.trim();
  const status = document.getElementById('stravaStatus');
  if(!clientId){ status.textContent = 'Renseigne au moins le Client ID (créé sur strava.com/settings/api).'; return; }
  SETTINGS.strava = {...(SETTINGS.strava||{}), clientId, workerUrl};
  await saveSettings();
  const redirectUri = window.location.origin + window.location.pathname;
  window.location.href = `https://www.strava.com/oauth/authorize?client_id=${encodeURIComponent(clientId)}&redirect_uri=${encodeURIComponent(redirectUri)}&response_type=code&scope=activity:read_all&approval_prompt=auto`;
}
async function handleStravaCallback(){
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  if(!code) return;
  window.history.replaceState({}, '', window.location.pathname);
  const strava = SETTINGS.strava || {};
  if(!strava.clientId) return;
  try{
    let resp;
    if(strava.workerUrl){
      resp = await fetch(strava.workerUrl+'/token', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({client_id:strava.clientId, code})
      });
    } else if(strava.clientSecret){
      resp = await fetch('https://www.strava.com/oauth/token', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({client_id:strava.clientId, client_secret:strava.clientSecret, code, grant_type:'authorization_code'})
      });
    } else {
      alert("Aucun relais configuré : l'échange de jeton va probablement échouer. Renseigne l'URL du relais dans Réglages → Strava, ou utilise le jeton manuel.");
      return;
    }
    const data = await resp.json();
    if(data.access_token){
      SETTINGS.strava.accessToken = data.access_token;
      SETTINGS.strava.refreshToken = data.refresh_token;
      SETTINGS.strava.expiresAt = data.expires_at;
      await saveSettings();
      await stravaFetchActivities(data.access_token, null, strava.workerUrl);
    } else {
      alert('Strava a répondu sans jeton — utilise le champ « jeton manuel » en repli.');
    }
  }catch(e){
    alert("L'échange de jeton a échoué depuis le navigateur (limite CORS connue côté Strava, sans relais configuré). Configure l'URL du relais Cloudflare Worker, ou utilise le jeton manuel.");
  }
}
async function stravaManualFetch(){
  const token = document.getElementById('stravaManualToken').value.trim();
  const status = document.getElementById('stravaManualStatus');
  if(!token){ status.textContent='Colle un token.'; return; }
  status.textContent = 'Récupération…';
  await stravaFetchActivities(token, status, (SETTINGS.strava||{}).workerUrl);
}
async function stravaFetchActivities(token, status, workerUrl){
  status = status || document.getElementById('stravaSyncStatus') || document.getElementById('stravaStatus');
  const base = workerUrl ? workerUrl+'/activities' : 'https://www.strava.com/api/v3/athlete/activities';
  try{
    const resp = await fetch(base+'?per_page=30', {headers:{'Authorization':'Bearer '+token}});
    if(!resp.ok) throw new Error('HTTP '+resp.status);
    const acts = await resp.json();
    let added = 0;
    acts.forEach(a=>{
      if(SESSIONS.find(s=>s.stravaId===a.id)) return;
      const sport = matchSport(a.type||a.sport_type);
      if(!sport) return;
      const session = {
        id:uid(), stravaId:a.id, date:a.start_date_local.slice(0,10), sport,
        duration: Math.round((a.moving_time||0)/60),
        distance: a.distance ? Math.round(a.distance/100)/10 : null,
        source:'strava', completion:null, notes:a.name||'',
      };
      autoLinkSession(session);
      SESSIONS.push(session);
      added++;
    });
    await saveSessions(); await savePlan();
    if(status) status.textContent = `${added} activité(s) récupérée(s) depuis Strava.`;
    renderAll();
  }catch(e){
    if(status) status.textContent = workerUrl
      ? "Le relais n'a pas répondu correctement — vérifie l'URL et que le Worker est bien déployé (voir README)."
      : "Connexion directe bloquée par Strava (CORS), sans relais configuré. Configure l'URL du relais, ou utilise le jeton manuel.";
  }
}
function autoLinkSession(session){
  const candidates = PLAN.filter(p=>!p.linkedSessionId && p.sport===session.sport);
  if(!candidates.length) return session;
  const d = new Date(session.date+'T00:00:00');
  let best=null, bestDiff=Infinity;
  candidates.forEach(p=>{
    const diff = Math.abs(new Date(p.date+'T00:00:00') - d);
    if(diff <= 86400000 && diff < bestDiff){ best=p; bestDiff=diff; }
  });
  if(best){
    const metric = SPORTS[session.sport].metric;
    let pct = null;
    if(metric==='distance' && best.targetDistance && session.distance) pct = Math.round(session.distance/best.targetDistance*100);
    else if(best.targetDuration && session.duration) pct = Math.round(session.duration/best.targetDuration*100);
    session.completion = pct;
    session.linkedPlanId = best.id;
    best.linkedSessionId = session.id;
  }
  return session;
}
async function handleGarminFile(file){
  const status = document.getElementById('garminStatus');
  status.textContent = 'Lecture du fichier…';
  if(!file.name.toLowerCase().endsWith('.csv')){
    status.textContent = "Format TCX/GPX : préfère l'export CSV de Garmin Connect (Activités → Exporter), ou ajoute la séance manuellement.";
    return;
  }
  const rows = (await file.text()).split('\n').map(r=>r.split(','));
  const header = rows[0].map(h=>h.toLowerCase().trim());
  const idxDate = header.findIndex(h=>h.includes('date'));
  const idxType = header.findIndex(h=>h.includes('activity type')||h.includes('type'));
  const idxDur = header.findIndex(h=>h.includes('time')||h.includes('durée')||h.includes('duree'));
  const idxDist = header.findIndex(h=>h.includes('distance'));
  let added = 0;
  rows.slice(1).forEach(r=>{
    if(r.length<2) return;
    const dateISO = parseFrenchDate(r[idxDate]);
    const sport = matchSport((r[idxType]||'').toString());
    if(!dateISO || !sport) return;
    const session = {
      id:uid(), date:dateISO, sport,
      duration: idxDur>-1 ? parseDurationToMin(r[idxDur]) : null,
      distance: idxDist>-1 ? Number(r[idxDist])||null : null,
      source:'garmin_csv', completion:null, notes:'',
    };
    autoLinkSession(session);
    SESSIONS.push(session);
    added++;
  });
  await saveSessions(); await savePlan();
  status.textContent = `${added} activité(s) importée(s) depuis le CSV Garmin.`;
  renderAll();
}
function parseDurationToMin(v){
  if(!v) return null;
  v = v.toString().trim();
  if(v.includes(':')){
    const parts = v.split(':').map(Number);
    if(parts.length===3) return Math.round(parts[0]*60+parts[1]+parts[2]/60);
    if(parts.length===2) return Math.round(parts[0]+parts[1]/60);
  }
  return Number(v)||null;
}

document.addEventListener('click', async (e)=>{
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act;

  switch(act){
    case 'tab': goTab(Number(el.dataset.i)); break;

    case 'goday':
      calSelected = el.dataset.d;
      calDate = new Date(el.dataset.d+'T00:00:00');
      goTab(1);
      break;

    case 'cal-nav':
      calDate = new Date(calDate.getFullYear(), calDate.getMonth()+Number(el.dataset.n), 1);
      renderAll();
      break;
    case 'cal-day': calSelected = el.dataset.d; renderAll(); break;

    case 'add-session':
      draft = newDraft(el.dataset.d || todayISO());
      openSessionSheet();
      break;
    case 'edit-session': {
      const s = SESSIONS.find(x=>x.id===el.dataset.id);
      if(!s) break;
      draft = {id:s.id, date:s.date, sport:s.sport, duration:s.duration||null, distance:s.distance||null,
               rpe:s.rpe||null, feel:s.feel||null, intervals:s.intervals||'', notes:s.notes||'',
               linkedPlanId:s.linkedPlanId||'', more: !!(s.rpe||s.feel||s.intervals||s.linkedPlanId)};
      openSessionSheet();
      break;
    }
    case 'draft-sport': readDraftInputs(); draft.sport = el.dataset.v; openSessionSheet(); break;
    case 'draft-dur': {
      readDraftInputs();
      const v = el.dataset.v;
      draft.duration = v==='+15' ? (draft.duration||0)+15 : Number(v);
      openSessionSheet();
      break;
    }
    case 'draft-more': readDraftInputs(); draft.more = !draft.more; openSessionSheet(); break;
    case 'draft-feel': readDraftInputs(); draft.feel = draft.feel===el.dataset.v ? null : el.dataset.v; openSessionSheet(); break;
    case 'draft-rpe': readDraftInputs(); draft.rpe = draft.rpe===Number(el.dataset.v) ? null : Number(el.dataset.v); openSessionSheet(); break;
    case 'save-session': await saveDraftSession(); break;
    case 'del-session': await deleteDraftSession(); break;

    case 'mark-done': {
      const p = PLAN.find(x=>x.id===el.dataset.id);
      if(!p) break;
      draft = newDraft(p.date, p.sport);
      draft.duration = p.targetDuration || null;
      draft.distance = p.targetDistance || null;
      draft.linkedPlanId = p.id;
      draft.more = true;
      openSessionSheet();
      break;
    }
    case 'edit-plan': openPlanSheet(el.dataset.id); break;
    case 'add-plan': openPlanSheet(null); break;
    case 'save-plan': await savePlanSheet(); break;
    case 'del-plan': {
      if(!confirm('Retirer cette séance du programme ?')) break;
      PLAN = PLAN.filter(x=>x.id!==el.dataset.id);
      await savePlan();
      closeSheet();
      renderAll();
      break;
    }
    case 'plan-filter': planFilter = el.dataset.v; renderAll(); break;

    case 'recap-period': recapPeriod = el.dataset.v; renderAll(); break;
    case 'recap-sport': recapSport = el.dataset.v; renderAll(); break;

    case 'settings-page': settingsPage = el.dataset.p; renderAll(); document.getElementById('pane4').scrollTop = 0; break;
    case 'settings-back': settingsPage = null; renderAll(); break;
    case 'goal': {
      const k = el.dataset.s;
      const goals = SETTINGS.goals || (SETTINGS.goals = {});
      const cur = (goals[k]||{}).sessions || 0;
      const next = Math.max(0, Math.min(14, cur + Number(el.dataset.n)));
      if(next===0) delete goals[k]; else goals[k] = {sessions:next};
      await saveSettings();
      renderAll();
      break;
    }
    case 'open-import': settingsPage = 'import'; goTab(4); break;
    case 'open-export': openExportSheet(); break;
    case 'do-export': exportSessionsCSV(); break;
    case 'export-backup': await exportBackup(); break;
    case 'import-pdf': await importPdfLines(); break;

    case 'strava-connect': await stravaConnect(); break;
    case 'strava-manual': await stravaManualFetch(); break;
    case 'strava-sync': await stravaFetchActivities((SETTINGS.strava||{}).accessToken, document.getElementById('stravaSyncStatus'), (SETTINGS.strava||{}).workerUrl); break;

    case 'toggle-notif': await toggleNotifications(el); break;
    case 'change-pw': await changePassword(); break;
    case 'save-secret': await saveSecretQuestion(); break;
    case 'lock-app': lockMode='login'; renderLock(); break;

    case 'close-sheet': closeSheet(); break;
  }
});

let lockMode = 'login';
async function sha256Hex(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function lockShell(inner){
  return `<div class="lock-wrap">
    <div class="brand">Carnet d'entrainement</div>
    ${inner}
  </div>`;
}
function renderLock(){
  const el = document.getElementById('lockScreen');
  const auth = SETTINGS.auth;
  if(!auth) el.innerHTML = lockShell(lockSetupHTML());
  else if(lockMode==='recover') el.innerHTML = lockShell(lockRecoverHTML());
  else if(lockMode==='reset') el.innerHTML = lockShell(lockResetHTML());
  else el.innerHTML = lockShell(lockLoginHTML(auth.email));
  el.style.display = 'block';
  document.getElementById('app').style.display = 'none';
  attachLockHandlers();
}
function lockSetupHTML(){
  return `<h1>Créer ton accès</h1>
  <div class="lock-sub">Protège ce carnet avec un email et un mot de passe. Ils restent stockés dans ce navigateur ; le mot de passe est haché, jamais gardé en clair.</div>
  <div class="field"><label>Email</label><input type="text" id="setupEmail" placeholder="toi@exemple.fr"></div>
  <div class="field"><label>Mot de passe</label><input type="password" id="setupPw"></div>
  <div class="field"><label>Confirmer</label><input type="password" id="setupPw2"></div>
  <div class="field"><label>Question secrète (facultatif)</label><input type="text" id="setupQuestion" placeholder="ex : Le nom de mon premier club ?"></div>
  <div class="field"><label>Réponse</label><input type="text" id="setupAnswer"></div>
  <button class="btn block" id="btnSetupCreate">Créer l'accès</button>
  <div class="lock-error" id="setupError"></div>`;
}
function lockLoginHTML(email){
  return `<h1>Content de te revoir</h1>
  <div class="lock-sub">Tes données restent sur cet appareil. Le mot de passe ne les quitte jamais.</div>
  <div class="field"><label>Email</label><input type="text" id="loginEmail" value="${esc(email||'')}"></div>
  <div class="field"><label>Mot de passe</label><input type="password" id="loginPw"></div>
  <button class="btn block" id="btnLoginGo">Ouvrir mon carnet</button>
  <button class="sheet-close" id="btnForgot" style="width:100%;margin-top:14px;text-align:center;">Mot de passe oublié ?</button>
  <div class="lock-error" id="loginError"></div>`;
}
function lockRecoverHTML(){
  const auth = SETTINGS.auth || {};
  if(!auth.secretQuestion){
    return `<h1>Récupération impossible</h1>
    <div class="lock-sub">Aucune question secrète n'a été configurée. Sans elle, il n'y a pas de moyen de réinitialiser le mot de passe sans effacer les données du site.</div>
    <button class="btn sec block" id="btnBackToLogin">Retour</button>`;
  }
  return `<h1>Mot de passe oublié</h1>
  <div class="lock-sub">${esc(auth.secretQuestion)}</div>
  <div class="field"><label>Réponse</label><input type="text" id="recoverAnswer"></div>
  <button class="btn block" id="btnRecoverGo">Valider</button>
  <button class="btn sec block" id="btnBackToLogin" style="margin-top:10px;">Retour</button>
  <div class="lock-error" id="recoverError"></div>`;
}
function lockResetHTML(){
  return `<h1>Nouveau mot de passe</h1>
  <div class="lock-sub">Choisis un nouveau mot de passe pour ton carnet.</div>
  <div class="field"><label>Nouveau mot de passe</label><input type="password" id="resetPw"></div>
  <div class="field"><label>Confirmer</label><input type="password" id="resetPw2"></div>
  <button class="btn block" id="btnResetGo">Réinitialiser et ouvrir</button>
  <div class="lock-error" id="resetError"></div>`;
}
function attachLockHandlers(){
  const g = id => document.getElementById(id);
  if(g('btnSetupCreate')) g('btnSetupCreate').onclick = async ()=>{
    const email = g('setupEmail').value.trim(), pw = g('setupPw').value, pw2 = g('setupPw2').value;
    const question = g('setupQuestion').value.trim(), answer = g('setupAnswer').value.trim();
    const err = g('setupError');
    if(!email || !pw){ err.textContent='Email et mot de passe requis.'; return; }
    if(pw!==pw2){ err.textContent='Les mots de passe ne correspondent pas.'; return; }
    if(pw.length<4){ err.textContent='Mot de passe trop court (4 caractères minimum).'; return; }
    SETTINGS.auth = {email, hash: await sha256Hex(pw)};
    if(question && answer){
      SETTINGS.auth.secretQuestion = question;
      SETTINGS.auth.secretAnswerHash = await sha256Hex(answer.toLowerCase());
    }
    await saveSettings();
    unlockApp();
  };
  if(g('btnLoginGo')){
    const go = async ()=>{
      const email = g('loginEmail').value.trim(), pw = g('loginPw').value, err = g('loginError');
      const auth = SETTINGS.auth;
      if(email.toLowerCase()===(auth.email||'').toLowerCase() && await sha256Hex(pw)===auth.hash) unlockApp();
      else err.textContent = 'Email ou mot de passe incorrect.';
    };
    g('btnLoginGo').onclick = go;
    g('loginPw').addEventListener('keydown', e=>{ if(e.key==='Enter') go(); });
    g('btnForgot').onclick = ()=>{ lockMode='recover'; renderLock(); };
  }
  if(g('btnBackToLogin')) g('btnBackToLogin').onclick = ()=>{ lockMode='login'; renderLock(); };
  if(g('btnRecoverGo')) g('btnRecoverGo').onclick = async ()=>{
    const hash = await sha256Hex(g('recoverAnswer').value.trim().toLowerCase());
    if(hash===SETTINGS.auth.secretAnswerHash){ lockMode='reset'; renderLock(); }
    else g('recoverError').textContent = 'Réponse incorrecte.';
  };
  if(g('btnResetGo')) g('btnResetGo').onclick = async ()=>{
    const p1 = g('resetPw').value, p2 = g('resetPw2').value, err = g('resetError');
    if(!p1 || p1!==p2){ err.textContent='Les mots de passe ne correspondent pas.'; return; }
    if(p1.length<4){ err.textContent='Mot de passe trop court (4 caractères minimum).'; return; }
    SETTINGS.auth.hash = await sha256Hex(p1);
    await saveSettings();
    lockMode='login';
    unlockApp();
  };
}
function unlockApp(){
  document.getElementById('lockScreen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  renderTabbar();
  setTrack(0, false);
  renderAll();
  checkReminders();
  if(!window._reminderInterval) window._reminderInterval = setInterval(checkReminders, 30*60*1000);
}
async function changePassword(){
  const g = id => document.getElementById(id);
  const status = g('pwStatus'), auth = SETTINGS.auth || {};
  if(await sha256Hex(g('pwCurrent').value)!==auth.hash){ status.textContent='Mot de passe actuel incorrect.'; return; }
  const n1 = g('pwNew').value, n2 = g('pwNew2').value;
  if(!n1 || n1!==n2){ status.textContent='Les nouveaux mots de passe ne correspondent pas.'; return; }
  if(n1.length<4){ status.textContent='Mot de passe trop court (4 caractères minimum).'; return; }
  SETTINGS.auth.hash = await sha256Hex(n1);
  await saveSettings();
  status.textContent = 'Mot de passe mis à jour.';
  g('pwCurrent').value=''; g('pwNew').value=''; g('pwNew2').value='';
}
async function saveSecretQuestion(){
  const g = id => document.getElementById(id);
  const q = g('secQuestion').value.trim(), a = g('secAnswer').value.trim(), status = g('secStatus');
  if(!q){ status.textContent='La question ne peut pas être vide.'; return; }
  SETTINGS.auth.secretQuestion = q;
  if(a) SETTINGS.auth.secretAnswerHash = await sha256Hex(a.toLowerCase());
  await saveSettings();
  status.textContent = 'Question secrète enregistrée.';
  g('secAnswer').value='';
}

/* ---------- rappels ---------- */
async function toggleNotifications(btn){
  const enabled = !btn.classList.contains('on');
  const status = document.getElementById('notifStatus');
  if(enabled && 'Notification' in window){
    const perm = await Notification.requestPermission();
    if(perm!=='granted'){
      if(status) status.textContent = "Autorisation refusée par le navigateur — les rappels restent désactivés.";
      return;
    }
  }
  SETTINGS.notifications = {...(SETTINGS.notifications||{}), enabled};
  await saveSettings();
  renderAll();
  const s2 = document.getElementById('notifStatus');
  if(s2) s2.textContent = enabled ? "Rappels activés, tant que l'appli reste ouverte." : 'Rappels désactivés.';
}
function checkReminders(){
  const notif = SETTINGS.notifications || {};
  if(!notif.enabled || !('Notification' in window) || Notification.permission!=='granted') return;
  if(localStorage.getItem(STORAGE_PREFIX+'reminder-shown-'+todayISO())) return;
  const todays = PLAN.filter(p=>p.date===todayISO() && !p.linkedSessionId);
  if(!todays.length) return;
  new Notification('Séance au programme aujourd\'hui', {body: todays.map(p=>sportLabel(p.sport)).join(', ')});
  localStorage.setItem(STORAGE_PREFIX+'reminder-shown-'+todayISO(), '1');
}

/* ============================================================
   INIT
   ============================================================ */
async function init(){
  SESSIONS = await loadKey('sessions', []);
  PLAN = await loadKey('plan', []);
  SETTINGS = await loadKey('settings', {});
  renderLock();
  document.getElementById('fabAdd').onclick = ()=>{
    draft = newDraft(tabIndex===1 ? (calSelected||todayISO()) : todayISO());
    openSessionSheet();
  };
  document.getElementById('sheetBackdrop').addEventListener('click', e=>{
    if(e.target.id==='sheetBackdrop') closeSheet();
  });
  await handleStravaCallback();
}
init();
</script>
